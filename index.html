ía una cresta larga en la cabeza?":[4,30.48,2.24],"¿Quién tenía la cabeza dura como un casco?":[4,33.02,2.42],"¿Quién tenía plumas?":[4,35.74,1.28],"¿Quién tenía un pincho en cada pulgar?":[4,37.32,1.86],"¿Quién tenía las patas de delante más largas que las de atrás?":[4,39.48,3.12],"¿Quién tenía una cabeza enorme y los brazos cortitos?":[4,42.9,3.12],"¿Para qué servía la maza de la cola del Anquilosaurio?":[4,46.32,2.82],"Para defenderse de los carnívoros.":[4,49.44,1.756],"¿Para qué servían los pinchos de la cola del Estegosaurio?":[4,51.496,2.96],"Para defenderse.":[4,54.756,1.1],"¿Para qué servía la cresta del Parasaurolofo?":[4,56.156,2.4],"Quizá para hacer sonidos, como una trompeta.":[4,58.856,2.48],"¿Para qué tenía plumas el Velocirraptor?":[4,61.636,2.12],"Para abrigarse y lucirse, porque no podía volar.":[4,64.056,2.64],"¿Para qué servían las garras enormes del Terizinosaurio?":[4,66.996,2.86],"Quizá para alcanzar ramas y para defenderse.":[4,70.156,2.4],"¿Por qué el Oviraptor abría los brazos sobre el nido?":[4,72.856,2.72],"Para dar calor a sus huevos y protegerlos.":[4,75.876,2.34],"¿Para qué tenía el Gallimimo las patas tan largas?":[4,78.516,2.72],"Para correr muy rápido.":[4,81.536,1.44],"¿Para qué servían las dos crestas del Dilofosaurio?":[4,83.276,2.6],"Quizá para lucirse ante otros dilofosaurios.":[4,86.176,2.56],"¿Para qué servía la cabeza tan dura del Paquicefalosaurio?":[4,89.036,3.06],"Quizá para darse cabezazos con otros.":[4,92.396,2.16],"¿Para qué servía el cuello tan largo del Braquiosaurio?":[4,94.856,2.76],"Para comer hojas de árboles altos.":[4,97.916,1.839],"¿Para qué servían las placas del Estegosaurio?":[4,100.055,2.34],"No se sabe seguro: quizá para lucirse o para calentarse al sol.":[4,102.695,3.92],"¿Para qué servía la vela del Espinosaurio?":[4,106.915,2.3],"No se sabe seguro: quizá para lucirse.":[4,109.515,2.6],"¿Para qué servía la joroba del Concavenator?":[4,112.415,2.42],"Todavía no se sabe.":[4,115.135,1.24],"¿Para qué servían las espinas del cuello del Amargasaurio?":[4,116.675,2.96],"Quizá para defenderse o para lucirse.":[4,119.935,2.36],"¿Para qué servía la vela del Morelladon?":[4,122.595,2.14],"No se sabe seguro: quizá para lucirse o para el calor.":[4,125.035,3.38],"¿Para qué le servían al Microraptor sus cuatro alas?":[4,128.715,2.88],"Para planear o volar entre los árboles.":[4,131.895,2.36],"¿Para qué tenía el Arqueópterix garras en las alas?":[4,134.555,2.76],"Quizá para trepar y agarrarse.":[4,137.615,1.82],"¿Para qué tenía el Pelecanimimo una bolsa en la garganta?":[4,139.735,3.08],"Quizá para guardar los peces que pescaba.":[4,143.115,2.26],"¿Para qué tenía el Mamenquisaurio un cuello tan largo?":[4,145.675,2.76],"Para alcanzar muchas plantas sin moverse.":[4,148.735,2.048],"Los dinosaurios ponían huevos.":[5,0.3,1.94],"Sí: los dinosaurios nacían de huevos, como los pájaros.":[5,2.54,3.98],"El Tiranosaurio rex comía plantas.":[5,6.82,2.34],"Comía carne: era un gran cazador.":[5,9.46,2.3],"El Triceratops tenía tres cuernos.":[5,12.06,2.14],"Dos cuernos largos encima de los ojos y uno cortito en la nariz.":[5,14.5,3.66],"El Braquiosaurio tenía el cuello muy largo.":[5,18.46,2.44],"Con su cuello largo comía las hojas de los árboles altos.":[5,21.2,3.14],"Las personas vivieron a la vez que los dinosaurios.":[5,24.64,2.88],"Las personas llegaron muchísimo después, cuando ya no había dinosaurios gigantes.":[5,27.82,4.7],"Algunos dinosaurios eran pequeños como una gallina.":[5,32.82,2.98],"El Compsognato era pequeño como una gallina.":[5,36.1,2.74],"El Estegosaurio tenía placas en la espalda.":[5,39.14,2.52],"Tenía dos filas de placas y cuatro pinchos en la cola.":[5,41.96,3.08],"Los dinosaurios eran mamíferos.":[5,45.34,1.96],"No: eran reptiles. Y las aves de hoy son dinosaurios.":[5,47.6,4.16],"El Velocirraptor tenía plumas.":[5,52.06,1.94],"Sí: estaba cubierto de plumas, como un pájaro.":[5,54.3,3.0],"Todos los dinosaurios eran gigantes.":[5,57.6,2.131],"Había dinosaurios enormes, pero también muchos pequeños.":[5,60.031,3.5],"El Dilofosaurio escupía veneno.":[5,63.831,2.1],"Eso solo pasa en las películas: no hay ninguna prueba.":[5,66.231,3.02],"El Velocirraptor era más alto que una persona.":[5,69.551,2.66],"Era del tamaño de un pavo. En las películas lo hacen mucho más grande.":[5,72.511,3.98],"Era un reptil volador, pariente de los dinosaurios.":[5,79.031,2.94],"El Oviraptor robaba huevos.":[5,82.271,1.98],"Probablemente estaba cuidando sus propios huevos.":[5,84.551,2.64],"El Tiranosaurio rex tenía los brazos muy cortos.":[5,87.491,3.02],"Eran cortitos, pero muy fuertes.":[5,90.811,2.28],"Los dinosaurios y los mamuts vivieron a la vez.":[5,93.391,2.42],"Los mamuts llegaron millones de años después.":[5,96.111,2.74],"El Brontosaurio es un dinosaurio de verdad.":[5,99.151,2.36],"Durante años se pensó que no, pero en 2015 los científicos dijeron que sí.":[5,101.811,4.62],"La Maiasaura cuidaba de sus crías.":[5,106.731,2.18],"Sus crías se quedaban un tiempo en el nido y las mamás las cuidaban.":[5,109.21,3.7],"El Espinosaurio vivía cerca del agua.":[5,113.21,2.24],"Vivía junto a los ríos y comía muchos peces.":[5,115.75,2.78],"El Plesiosaurio era un dinosaurio que vivía en el mar.":[5,118.83,2.88],"Vivía en el mar, pero era un reptil marino, no un dinosaurio.":[5,122.01,3.36],"Las aves son dinosaurios.":[5,125.67,1.86],"Las aves vienen de dinosaurios con plumas: son dinosaurios que siguen vivos.":[5,127.83,4.44],"Muchos dinosaurios tenían plumas.":[5,132.57,1.98],"El Velocirraptor, el Microraptor y muchos otros tenían plumas.":[5,134.85,4.16],"El Tiranosaurio rex vivió más cerca de nosotros que del Estegosaurio.":[5,139.31,3.88],"El Estegosaurio vivió hace unos 150 millones de años, y el Tiranosaurio rex hace unos 68 millones.":[5,143.49,7.08],"Un asteroide acabó con la mayoría de los dinosaurios.":[5,150.87,2.9],"Hace unos 66 millones de años chocó un asteroide gigante contra la Tierra.":[5,154.07,4.68],"En España se han encontrado muchos dinosaurios.":[5,159.05,2.64],"Por ejemplo, el Concavenator en Cuenca y el Turiasaurio en Teruel.":[5,161.99,4.04],"Los científicos saben qué comían por sus dientes y sus cacas fosilizadas.":[5,166.33,4.0],"Los dientes y las cacas fosilizadas, que se llaman coprolitos, dan muchas pistas.":[5,170.63,4.48],"El Microraptor tenía cuatro alas.":[5,175.41,2.22],"Tenía plumas largas en los brazos y en las patas.":[5,177.93,2.56],"Algunos dinosaurios tenían más de 200 dientes.":[5,180.79,2.96],"El Pelecanimimo, encontrado en Cuenca, tenía más de 200 dientes pequeñitos.":[5,184.05,4.706],"En este huevo están los juegos de cuándo y dónde vivieron los dinosaurios. ¡Muy pronto se abrirá!":[6,0.3,5.76],"En este huevo están los cuentos de Mochi. ¡Muy pronto se abrirá!":[6,14.14,3.907],"Pteranodon":[7,0.3,0.96],"El Pteranodon era un dinosaurio.":[7,1.56,1.906],"Paleontólogos":[8,0.3,1.2],"¡A excavar!":[8,1.8,0.84],"Monta el esqueleto":[8,2.94,1.26],"Sigue las huellas":[8,4.5,1.18],"¿Qué hace un paleontólogo?":[8,5.98,1.46],"¡Enhorabuena! ¡Has conseguido todas las estrellas de Paleontólogos! ¡Aquí tienes tu trofeo!":[8,7.74,5.08],"¡Increíble! ¡Has conseguido todas las estrellas del nivel difícil de Paleontólogos! ¡Aquí tienes tu trofeo de fuego!":[8,13.12,6.62],"¡Nivel experto superado! ¡Has conseguido todas las estrellas del nivel experto de Paleontólogos! ¡Aquí tienes tu trofeo galáctico!":[8,20.04,7.86],"En este huevo están los juegos de paleontólogos. Se abrirá cuando consigas todas las estrellas de Cómo eran.":[8,28.2,5.96],"¡Mira! El huevo azul se está moviendo. ¡Tócalo para abrirlo!":[8,34.46,3.64],"¡Ha salido una sección nueva: Paleontólogos! Vamos a excavar fósiles y a montar esqueletos.":[8,38.4,5.568],"Quita la arena con el dedo para descubrir el fósil.":[9,0.3,2.82],"¿De quién es este esqueleto?":[9,3.42,1.5],"¿Qué has encontrado?":[9,5.22,1.14],"No todos los fósiles son de dinosaurios. ¿Qué fósil es?":[9,6.66,3.68],"Arrastra cada pieza hasta su sitio para montar el esqueleto.":[9,10.64,3.22],"Algunas piezas están giradas: tócalas para girarlas y después arrástralas a su sitio.":[9,14.16,5.18],"Esa pieza no va ahí. Fíjate bien en los huesos.":[9,19.64,3.12],"Esa pieza va ahí, pero está girada. Tócala para girarla.":[9,23.06,3.72],"¡Esqueleto montado!":[9,27.08,1.32],"¿Quién dejó esta huella?":[9,28.7,1.38],"¿Hacia dónde iba el dinosaurio?":[9,30.38,1.68],"¿Cuántos dinosaurios pasaron por aquí?":[9,32.36,1.96],"¿Iba andando o corriendo?":[9,34.62,1.56],"¿Iba solo o en grupo?":[9,36.48,1.5],"¿Cuál de los dos iba más deprisa?":[9,38.28,1.88],"Ordena los pasos: toca primero lo que se hace antes.":[9,40.46,3.42],"¡Muy bien! Así trabaja un paleontólogo, paso a paso.":[9,44.18,3.68],"¿Cómo se forma un fósil? Ordena los pasos: toca primero lo que pasa antes.":[9,48.16,5.22],"¡Muy bien! Así se forma un fósil.":[9,53.68,2.3],"Es el esqueleto del Tiranosaurio rex.":[9,56.28,2.34],"Mira su cabeza enorme llena de dientes y sus brazos cortitos.":[9,58.92,3.56],"Es el esqueleto del Triceratops.":[9,62.78,1.94],"Mira los tres cuernos y la gola de hueso de su cabeza.":[9,65.02,2.94],"Es el esqueleto del Estegosaurio.":[9,68.26,2.02],"Mira las placas de su espalda y los pinchos de su cola.":[9,70.58,2.88],"Es el esqueleto del Braquiosaurio.":[9,73.76,2.04],"Mira su cuello larguísimo, como el de una jirafa.":[9,76.1,2.94],"Es el esqueleto del Espinosaurio.":[9,79.34,1.96],"Mira la vela de espinas de su espalda y su hocico largo, como el de un cocodrilo.":[9,81.6,4.6],"Es el esqueleto del Anquilosaurio.":[9,86.5,1.92],"Mira la maza de hueso al final de su cola.":[9,88.72,2.16],"Es el esqueleto del Parasaurolofo.":[9,91.18,2.02],"Mira la cresta larga y hueca de su cabeza.":[9,93.5,2.24],"Es el esqueleto del Velocirraptor.":[9,96.04,1.92],"Mira la garra grande y curva de sus patas.":[9,98.26,2.36],"Es el esqueleto del Paquicefalosaurio.":[9,100.92,2.2],"Mira el hueso gordísimo de encima de su cabeza, como un casco.":[9,103.42,3.58],"Es un diente afilado y con sierra: era de un dinosaurio que comía carne.":[9,107.3,4.06],"Es un diente con forma de hojita: era de un dinosaurio que comía plantas.":[9,111.66,4.22],"Es una garra curva y afilada. Las garras servían para agarrar y para defenderse.":[9,116.18,4.82],"¡Es un huevo de dinosaurio! Los dinosaurios ponían huevos, como las aves.":[9,121.3,4.56],"Es una huella. Las huellas nos cuentan cómo andaban los dinosaurios.":[9,126.16,4.04],"Es una caca fosilizada. Se llama coprolito y nos dice qué comía.":[9,130.5,4.54],"Es un cráneo, el hueso de la cabeza. ¡Este es de un Tiranosaurio rex!":[9,135.34,4.66],"Es un hueso de la pata. Juntando muchos huesos se monta un esqueleto.":[9,140.3,4.22],"Es un amonites: un animal del mar con concha en espiral, pariente de los pulpos y los calamares.":[9,144.82,5.72],"Es un trilobites: un animal del mar que vivió muchísimo antes que los dinosaurios.":[9,150.84,4.98],"Es un mosquito atrapado en ámbar, la resina de un árbol que se endureció hace millones de años.":[9,156.12,5.12],"Es un helecho fósil: las plantas también se convierten en fósiles.":[9,161.54,3.9],"Es un pez fósil. Los peces ya vivían en el agua mucho antes que los dinosaurios.":[9,165.74,4.78],"Es un diente de tiburón fósil. ¡Los tiburones ya existían antes que los dinosaurios!":[9,170.82,5.0],"Tres dedos finos con garras afiladas: es la huella de un carnívoro que andaba sobre dos patas.":[9,176.12,5.32],"Una huella grande y redonda, como la de un elefante: es de un dinosaurio de cuello largo, que andaba sobre cuatro patas.":[9,181.74,6.94],"Tres dedos gordos y redondeados: es la huella de un herbívoro con pico, como el Iguanodonte o el Parasaurolofo.":[9,188.98,6.7],"Solo dos dedos: los raptores, como el Velocirraptor, llevaban levantada su garra grande, por eso sus huellas tienen dos dedos.":[9,195.98,7.88],"Los dedos de las huellas apuntan hacia la derecha: iba hacia la derecha.":[9,204.16,3.94],"Los dedos de las huellas apuntan hacia la izquierda: iba hacia la izquierda.":[9,208.4,3.9],"Hay un camino de huellas: pasó un dinosaurio.":[9,212.6,2.598],"Hay dos caminos de huellas: pasaron dos dinosaurios.":[9,215.498,3.0],"Hay tres caminos de huellas: pasaron tres dinosaurios.":[9,218.798,3.22],"Las huellas están cerca unas de otras: daba pasos cortos, iba andando.":[9,222.318,4.52],"Las huellas están muy separadas: daba pasos largos, ¡iba corriendo!":[9,227.138,4.42],"Solo hay un camino de huellas: iba solo.":[9,231.858,2.56],"Hay muchos caminos de huellas juntos que van hacia el mismo lado: iban en grupo, como una manada.":[9,234.718,5.38],"Iba más deprisa el de arriba: sus huellas están más separadas porque daba pasos más largos.":[9,240.398,4.86],"Iba más deprisa el de abajo: sus huellas están más separadas porque daba pasos más largos.":[9,245.558,4.96],"¿Con qué quita la arena del fósil, con mucho cuidado?":[9,250.818,2.84],"Con un pincel: así quita la arena sin romper el fósil.":[9,253.958,3.4],"¿Con qué mira los detalles más pequeños?":[9,257.658,2.18],"Con una lupa, que hace que todo se vea más grande.":[9,260.138,2.9],"¿Con qué rompe la roca dura que hay alrededor del fósil?":[9,263.338,2.94],"Con un martillo y un cincel, dando golpecitos con cuidado.":[9,266.578,3.38],"¿Con qué cava la tierra?":[9,270.258,1.34],"Con una pala, pero lejos del fósil, para no romperlo.":[9,271.898,3.18],"¿Con qué mide lo largo que es un hueso?":[9,275.378,2.04],"Con una regla o con una cinta de medir.":[9,277.718,2.2],"¿Dónde dibuja y apunta lo que encuentra?":[9,280.217,2.22],"En un cuaderno: dibuja y apunta dónde estaba cada hueso.":[9,282.737,3.54],"¿Qué se pone para proteger su cabeza?":[9,286.577,2.06],"Un casco, por si cae alguna piedra.":[9,288.937,2.08],"¿Con qué hace fotos de lo que encuentra?":[9,291.317,1.88],"Con una cámara, antes de mover nada.":[9,293.497,2.28],"Buscar fósiles en las rocas":[9,296.077,1.86],"Excavar con cuidado":[9,298.237,1.32],"Limpiar la arena con el pincel":[9,299.857,1.82],"Envolver los huesos en yeso":[9,301.977,1.84],"Llevarlos al museo":[9,304.117,1.327],"Montar el esqueleto":[9,305.745,1.38],"¿Por qué envuelven los huesos en yeso?":[9,307.425,1.98],"El yeso se pone duro y protege los huesos, como la escayola de un brazo roto.":[9,309.705,4.16],"¿Por qué usan un pincel y no una pala para limpiar el fósil?":[9,314.165,3.38],"Los fósiles son delicados: el pincel quita la arena sin hacerles daño.":[9,317.845,4.12],"¿Dónde se guardan los fósiles para que todos los veamos?":[9,322.265,2.84],"En los museos se guardan, se estudian y se enseñan a todo el mundo.":[9,325.405,3.84],"¿Por qué hacen fotos y apuntan dónde estaba cada hueso?":[9,329.545,2.92],"Así saben cómo estaba el animal y pueden montar bien su esqueleto.":[9,332.765,3.46],"Un dinosaurio muere cerca de un río":[9,336.525,2.08],"El barro y la arena lo tapan":[9,338.905,1.66],"Pasan millones de años y los huesos se vuelven piedra":[9,340.865,3.06],"La roca sale a la superficie":[9,344.225,1.72],"Un paleontólogo lo encuentra":[9,346.245,1.6],"¿Qué partes de un dinosaurio se convierten en fósil más fácilmente?":[9,348.145,3.44],"Los huesos y los dientes son duros; lo blando casi siempre desaparece antes de convertirse en fósil.":[9,351.885,5.44],"¿Cuánto tarda en formarse un fósil?":[9,357.625,1.8],"Hacen falta muchísimos años para que el hueso se convierta en piedra.":[9,359.725,3.48],"¿Un fósil de hueso es un hueso de verdad?":[9,363.505,2.32],"El agua mete minerales dentro del hueso y, poco a poco, lo convierte en piedra.":[9,366.125,4.32],"¿Qué significa la palabra paleontólogo?":[9,370.745,2.16],"Paleo significa antiguo: los paleontólogos estudian los seres vivos de hace muchísimo tiempo.":[9,373.205,5.38],"¿Vivieron personas a la vez que los dinosaurios?":[9,378.885,2.5],"Entre los últimos dinosaurios y las primeras personas pasaron más de sesenta millones de años.":[9,381.685,5.1],"¿Cómo saben de qué color eran algunos dinosaurios con plumas?":[9,387.084,3.18],"En algunas plumas fósiles se ven, con el microscopio, unas bolitas diminutas que les daban color.":[9,390.564,5.342],"¡Hola! Soy Mochi, tu mochila. ¿Cómo te llamas? Escribe tu nombre y elige tu dinosaurio.":[10,0.3,5.46],"Puedes cambiar tu nombre o elegir otro dinosaurio.":[10,6.06,2.5],"¿Quién dejó estas pistas?":[11,0.3,1.54],"¿Qué fósil es el más antiguo?":[11,2.14,1.72],"¿Qué fósil es el más moderno?":[11,4.16,1.9],"Las capas de abajo se formaron primero: el fósil más antiguo es el de más abajo.":[11,6.36,4.74],"Las capas de arriba se formaron las últimas: el fósil más moderno es el de más arriba.":[11,11.4,4.88],"Toca los fósiles en orden: del más antiguo al más moderno.":[11,16.58,3.78],"¡Muy bien! Las capas se fueron formando unas encima de otras: los fósiles más antiguos están abajo.":[11,20.66,6.56],"¡El museo se ha equivocado! Una pieza de este esqueleto es de otro dinosaurio. Encuéntrala.":[11,27.52,5.42],"Esa pieza sí es de este esqueleto. Busca otra.":[11,33.24,3.2],"¡Bien visto! Esa pieza es de otro dinosaurio.":[11,36.74,3.12],"¿Y de quién es el esqueleto?":[11,40.16,1.46],"¿Qué pasó aquí?":[11,41.92,0.96],"¿Qué hizo este dinosaurio?":[11,43.18,1.46],"¿Cuál de los dos pasó antes?":[11,44.94,1.66],"Truco de paleontólogo: la cadera estaba unas cuatro veces más alta que lo que mide la huella.":[11,46.9,5.2],"La pieza equivocada era del Tiranosaurio rex.":[11,52.4,2.78],"La pieza equivocada era del Triceratops.":[11,55.48,2.66],"La pieza equivocada era del Estegosaurio.":[11,58.44,2.76],"La pieza equivocada era del Braquiosaurio.":[11,61.5,2.68],"La pieza equivocada era del Espinosaurio.":[11,64.48,2.72],"La pieza equivocada era del Anquilosaurio.":[11,67.5,2.72],"La pieza equivocada era del Parasaurolofo.":[11,70.52,2.86],"La pieza equivocada era del Velocirraptor.":[11,73.68,2.66],"La pieza equivocada era del Paquicefalosaurio.":[11,76.64,3.02],"Un diente con sierra y una huella de tres dedos con garras: era un gran carnívoro que andaba sobre dos patas.":[11,79.96,6.2],"Un diente de hojita y una huella grande y redonda: era un herbívoro de cuello largo que andaba a cuatro patas.":[11,86.46,6.066],"Una garra curva y una huella de solo dos dedos: era un raptor, como el Velocirraptor, que llevaba su garra grande levantada.":[11,92.825,7.8],"Un diente de comer plantas y una huella de tres dedos gordos: era un herbívoro con pico, como el Iguanodonte.":[11,100.925,6.6],"Un cráneo con pico y sin dientes junto a un nido de huevos: era un Oviraptor cuidando sus huevos.":[11,107.825,5.9],"Un cráneo enorme lleno de dientes y una caca fosilizada con trocitos de hueso: era un Tiranosaurio rex.":[11,114.026,6.44],"Un hueso de la pata enorme, un diente de hojita y una huella redonda: era un gigante de cuello largo.":[11,120.766,6.3],"Una garra enorme, un diente y restos de pez: era un dinosaurio pescador, como el Barionix.":[11,127.366,5.74],"Estos fósiles se encontraron en lo alto de una montaña. ¿Qué había aquí hace millones de años?":[11,133.406,5.68],"Amonites, peces y dientes de tiburón vivían en el mar: hace millones de años, aquí había mar.":[11,139.386,6.1],"¿Qué había aquí hace millones de años?":[11,145.786,2.32],"Helechos, huellas y dientes de comer plantas: aquí había tierra firme con plantas, y por ella paseaban dinosaurios.":[11,148.406,7.44],"Muchos huevos juntos en la misma capa: aquí había nidos. Algunos dinosaurios ponían sus huevos juntos, en colonias.":[11,156.146,7.5],"Peces, plantas y huellas en el barro: aquí había un río, y los dinosaurios paseaban por su orilla.":[11,163.946,6.28],"Los dedos apuntan hacia donde iban. Los dos van hacia el mismo lado y el carnívoro va detrás del herbívoro: parece que lo seguía.":[11,170.526,8.0],"Hay huellas grandes y pequeñas que van juntas hacia el mismo lado: era una manada con adultos y crías.":[11,178.826,5.86],"Los pasos son cada vez más largos: empezó a correr.":[11,184.985,3.44],"Las dos últimas huellas están una al lado de la otra: se paró.":[11,188.725,3.86],"Las huellas hacen una curva y vuelven hacia atrás: dio la vuelta.":[11,192.885,3.82],"Una huella de tres dedos pisa a una huella redonda: el de las huellas redondas pasó antes.":[11,197.005,5.36],"Una huella redonda pisa a una huella de tres dedos: el de las huellas de tres dedos pasó antes.":[11,202.665,5.74],"Esta huella mide 25 centímetros. ¿A qué altura tenía la cadera?":[11,208.705,4.4],"25 por 4 son 100 centímetros: su cadera estaba a 1 metro del suelo.":[11,213.405,5.14],"Esta huella mide 50 centímetros. ¿A qué altura tenía la cadera?":[11,218.845,4.2],"50 por 4 son 200 centímetros: su cadera estaba a 2 metros del suelo.":[11,223.345,5.32],"Esta huella mide 75 centímetros. ¿A qué altura tenía la cadera?":[11,228.965,4.5],"75 por 4 son 300 centímetros: su cadera estaba a 3 metros del suelo, casi tan alta como una canasta de baloncesto.":[11,233.765,8.646],"Cuándo y dónde":[12,0.3,1.24],"La línea del tiempo":[12,1.84,1.38],"Viaje en el tiempo":[12,3.52,1.24],"¿Quién se ha colado?":[12,5.06,1.14],"¿Dónde se encontró?":[12,6.5,1.1],"¡Enhorabuena! ¡Has conseguido todas las estrellas de Cuándo y dónde! ¡Aquí tienes tu trofeo!":[12,7.9,5.28],"¡Increíble! ¡Has conseguido todas las estrellas del nivel difícil de Cuándo y dónde! ¡Aquí tienes tu trofeo de fuego!":[12,13.48,6.78],"¡Nivel experto superado! ¡Has conseguido todas las estrellas del nivel experto de Cuándo y dónde! ¡Aquí tienes tu trofeo galáctico!":[12,20.56,7.74],"En este huevo están los juegos de cuándo y dónde vivieron los dinosaurios. Se abrirá cuando consigas todas las estrellas de Conoce a los dinos.":[12,28.6,7.82],"¡Mira! El huevo morado se está moviendo. ¡Tócalo para abrirlo!":[12,36.72,3.8],"¡Ha salido una sección nueva: Cuándo y dónde! Vamos a viajar en el tiempo y por el mapa.":[12,40.82,4.941],"Ordena los momentos: toca primero el más antiguo. Escucha las pistas: cada una te dice algo de otro momento.":[13,0.3,7.06],"Ordena los momentos, del más antiguo al más moderno. Esta vez no hay pistas.":[13,7.66,4.82],"Coloca cada tarjeta en su sitio de la regla del tiempo: toca una tarjeta y después su sitio.":[13,12.78,5.44],"Piensa qué pasó antes.":[13,18.52,1.58],"Ahí no va. Mira los millones de años.":[13,20.4,2.52],"¡Bien colocado! Ahora piensa.":[13,23.22,2.34],"La máquina del tiempo ha parado. ¿En qué época estamos?":[13,25.86,3.34],"¿En qué época vivió este dinosaurio?":[13,29.5,2.06],"¿Pudieron verse estos dos?":[13,31.86,1.52],"Alguien se ha colado en el viaje. ¿Quién es?":[13,33.68,2.68],"En este paisaje hay dos cosas que no son de esta época: un animal y una planta. Encuéntralas.":[13,36.66,5.98],"¡Bien! Todavía queda otra cosa que no es de esta época.":[13,42.94,3.3],"Toca el continente en el mapa.":[13,46.54,1.68],"Lee las pistas y piensa: ¿dónde se encontró?":[13,48.52,2.82],"¿En qué provincia se encontró? Toca la provincia en el mapa.":[13,51.64,3.46],"Hace unos 200 millones de años, todos los continentes estaban juntos: era Pangea. Toca un continente y después su sitio.":[13,55.4,8.08],"Ese no es su sitio. Fíjate en la forma de la costa.":[13,63.78,3.18],"¡Pangea montada! Así estaba el mundo cuando empezaron los dinosaurios.":[13,67.26,4.32],"¿Por qué?":[13,71.88,0.62],"Esa planta sí podía estar aquí.":[13,72.8,1.84],"Estamos en el Triásico.":[13,74.94,1.5],"Ese sí vivió en el Triásico.":[13,76.74,1.84],"Estamos en el Jurásico.":[13,78.88,1.52],"Ese sí vivió en el Jurásico.":[13,80.7,1.76],"Estamos en el Cretácico.":[13,82.76,1.56],"Ese sí vivió en el Cretácico.":[13,84.62,1.86],"Los primeros dinosaurios: hace unos 230 millones de años.":[13,86.78,4.28],"El Braquiosaurio: hace unos 150 millones de años.":[13,91.36,3.944],"El Estegosaurio: hace unos 150 millones de años.":[13,95.604,3.8],"Las primeras flores: hace unos 130 millones de años.":[13,99.704,3.86],"El Tiranosaurio rex: hace unos 67 millones de años.":[13,103.864,3.98],"El asteroide: hace 66 millones de años.":[13,108.144,3.3],"Los mamuts: hace unos pocos millones de años.":[13,111.744,3.12],"Las primeras personas: hace unos 300.000 años.":[13,115.164,3.5],"Fue lo primero de todo: antes no había dinosaurios.":[13,118.964,3.3],"Vivió después de los primeros dinosaurios.":[13,122.564,2.4],"Cayó mucho después del Braquiosaurio.":[13,125.264,2.24],"Llegaron muchísimo después del asteroide.":[13,127.804,2.38],"Antes que ellos no había ningún dinosaurio.":[13,130.484,2.48],"Vivió mucho antes que el Tiranosaurio rex.":[13,133.264,2.5],"Vivió justo antes de que cayera el asteroide.":[13,136.064,2.46],"Vivieron cuando ya no quedaba ningún Tiranosaurio rex.":[13,138.824,3.0],"Comía hojas de los árboles: en su época aún no había flores.":[13,142.124,3.76],"Aparecieron antes de que cayera el asteroide.":[13,146.184,2.4],"Después de caer, ya no quedó ningún dinosaurio gigante.":[13,148.884,3.2],"Son lo más moderno de todo.":[13,152.384,1.68],"Cuando aparecieron, todavía no había flores.":[13,154.364,2.38],"Ya existían cuando vivió el Tiranosaurio rex.":[13,157.044,2.68],"Ninguna persona llegó a verlo.":[13,160.024,1.9],"Vivió muchos millones de años antes que el Tiranosaurio rex.":[13,162.224,3.42],"Llegaron cuando los dinosaurios gigantes ya no existían.":[13,165.944,3.14],"Vivió mucho después que el Braquiosaurio.":[13,169.384,2.3],"Llegaron muchísimo después que el Tiranosaurio rex.":[13,171.984,2.9],"¿Quién vivió más cerca de nosotros en el tiempo: el Tiranosaurio rex o el Estegosaurio?":[13,175.184,5.08],"Entre el Estegosaurio y el Tiranosaurio rex pasaron unos 80 millones de años; entre el Tiranosaurio rex y nosotros, unos 66.":[13,180.564,8.56],"¿Cuánto tiempo ha pasado desde que cayó el asteroide?":[13,189.424,2.66],"El asteroide cayó hace 66 millones de años, muchísimo antes de que hubiera personas.":[13,192.384,5.28],"¿Qué está más lejos en el tiempo: los primeros dinosaurios o las primeras flores?":[13,197.964,4.44],"Los primeros dinosaurios aparecieron unos 100 millones de años antes que las primeras flores.":[13,202.704,4.88],"¿Pudo el Estegosaurio oler una flor?":[13,207.884,2.02],"El Estegosaurio vivió hace unos 150 millones de años, y las primeras flores son de hace unos 130.":[13,210.204,6.54],"Los dinosaurios gigantes vivieron unos 165 millones de años. Las personas llevamos unos 300.000. ¿Quién ha durado más?":[13,217.044,8.26],"Los dinosaurios gigantes duraron unas quinientas veces más de lo que llevamos las personas.":[13,225.604,4.7],"Si toda la historia de los dinosaurios cupiera en un solo día, ¿cuánto llevaríamos las personas?":[13,230.604,5.2],"Comparadas con los dinosaurios, las personas acabamos de llegar: unos tres minutos de un día entero.":[13,236.104,5.72],"¿Cuándo aparecieron las primeras aves, como el Arqueopterix?":[13,242.124,3.02],"El Arqueopterix vivió hace unos 150 millones de años. Las aves son dinosaurios que han llegado hasta hoy.":[13,245.444,6.3],"¿Pudo alguna persona ver caer el asteroide?":[13,252.044,2.3],"Cuando cayó el asteroide faltaban más de 65 millones de años para que aparecieran las personas.":[13,254.644,5.44],"Mira: entre las plantas hay flores de colores.":[13,260.384,2.84],"Las primeras flores aparecieron en el Cretácico.":[13,263.524,2.7],"Un Estegosaurio come helechos junto al río.":[13,266.523,2.48],"El Estegosaurio vivió en el Jurásico.":[13,269.303,2.2],"Los dinosaurios acaban de aparecer y todavía son pequeños.":[13,271.803,3.26],"Los primeros dinosaurios aparecieron en el Triásico.":[13,275.363,2.88],"Un Braquiosaurio estira el cuello para comer de los árboles más altos.":[13,278.543,3.62],"El Braquiosaurio, uno de los gigantes de cuello largo, vivió en el Jurásico.":[13,282.463,4.3],"Un Triceratops pasea entre magnolias en flor.":[13,287.063,2.56],"El Triceratops vivió en el Cretácico, cuando ya había flores.":[13,289.923,3.6],"Todos los continentes están juntos y los primeros dinosaurios corren por ellos.":[13,293.823,4.22],"En el Triásico aparecieron los primeros dinosaurios, y todos los continentes estaban juntos.":[13,298.343,5.22],"En el cielo se ve una luz enorme: ¡el asteroide está a punto de caer!":[13,303.863,3.92],"El asteroide cayó al final del Cretácico.":[13,308.083,2.4],"Un pequeño Celofisis corre entre helechos.":[13,310.783,2.48],"El Celofisis fue uno de los primeros dinosaurios, en el Triásico.":[13,313.563,3.76],"Hay helechos y árboles altísimos, pero ninguna flor, y los gigantes de cuello largo comen sus hojas.":[13,317.623,5.94],"Los gigantes de cuello largo y los helechos sin flores son del Jurásico.":[13,323.863,3.68],"A lo lejos ruge un Tiranosaurio rex.":[13,327.843,2.68],"El Tiranosaurio rex vivió al final del Cretácico.":[13,330.823,2.92],"Fue de los primeros dinosaurios grandes: comía plantas cuando los dinosaurios llevaban poco tiempo en la Tierra.":[13,334.043,5.86],"Vivió poco después de que aparecieran los primeros dinosaurios.":[13,340.203,3.22],"Es uno de los dinosaurios más antiguos que se conocen.":[13,343.723,2.98],"Cazaba cuando los dinosaurios acababan de aparecer.":[13,347.003,2.68],"Cazaba Estegosaurios.":[13,349.983,1.52],"Vivió en el mismo sitio y en la misma época que el Estegosaurio.":[13,351.803,3.44],"Vivió en la época del Estegosaurio, junto a la primera ave.":[13,355.543,3.2],"Era uno de los gigantes de cuello largo, cuando aún no había flores.":[13,359.043,3.68],"Cazaba en la Antártida al principio de la época de los gigantes de cuello largo.":[13,363.023,3.94],"Fue un gigante de cuello largo que vivió en Teruel en la época del Estegosaurio.":[13,367.263,4.18],"Vivió en Asia cuando ya había flores.":[13,371.743,2.32],"Pescaba en ríos con plantas con flores en la orilla.":[13,374.363,2.7],"Se defendía con su maza de los mordiscos del Tiranosaurio rex.":[13,377.363,3.64],"Corría por Asia poco antes de que cayera el asteroide.":[13,381.303,2.94],"Cazaba junto a un lago de Cuenca donde crecían algunas de las primeras flores.":[13,384.543,4.12],"Vivió cuando aparecieron las primeras flores.":[13,388.963,2.4],"Cazaba en Australia cuando ya había flores.":[13,391.663,2.48],"Los dos vivieron en Norteamérica hace unos /* código de progreso: sirve para otro iPad y para pasar de Safari a la app de la pantalla de inicio,
   que en el iPad guardan sus datos por separado */
/* El código va sin palabras delante («MOCHILA:» parecía un enlace y el iPad lo cambiaba al pegarlo)
   y solo con letras, números, - y _. Al leerlo se busca el código dentro de lo que se haya pegado. */
const exportCode=()=>btoa(unescape(encodeURIComponent(JSON.stringify({v:1,players:DB.players})))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
function readCode(t){
  t=t.replace(/-/g,'+').replace(/_/g,'/').replace(/[^A-Za-z0-9+/]/g,''); while(t.length%4) t+='=';
  const d=JSON.parse(decodeURIComponent(escape(atob(t)))); if(!d||!Array.isArray(d.players)) throw new Error('código'); return d;
}
function findCode(txt){
  let s=String(txt||''); try{if(/%[0-9a-f]{2}/i.test(s)) s=decodeURIComponent(s);}catch(e){}
  const tries=[...(s.match(/[A-Za-z0-9+/_-]{16,}=*/g)||[]).sort((a,b)=>b.length-a.length),s.replace(/^[\s\S]*?mochila\s*:/i,'').replace(/\s+/g,'')];
  for(const t of tries){try{return readCode(t);}catch(e){}}
  throw new Error('código');
}
function importCode(txt){
  const d=findCode(txt);
  const arr=v=>Array.isArray(v)?v:[], norm=v=>String(v||'').trim().toLowerCase(); let n=0, last=null;
  d.players.forEach(p=>{if(!p||!p.id||!p.name) return;
    const cur=DB.players.find(x=>x.id===p.id)||DB.players.find(x=>norm(x.name)===norm(p.name));
    if(cur){cur.stars=cur.stars||{};Object.entries(p.stars||{}).forEach(([k,v])=>{if((cur.stars[k]||0)<v)cur.stars[k]=v;});
      cur.read=[...new Set([...arr(cur.read),...arr(p.read)])].slice(-90);cur.album=[...new Set([...arr(cur.album),...arr(p.album)])];
      cur.trophies=[...new Set([...arr(cur.trophies),...arr(p.trophies)])];last=cur;}
    else{last={id:String(p.id),name:String(p.name).slice(0,16),avatar:p.avatar||'🦊',stars:p.stars||{},read:arr(p.read),album:arr(p.album),trophies:arr(p.trophies)};DB.players.push(last);}
    n++;});
  if(!n) throw new Error('vacío');
  if(!DB.cur||!me()) DB.cur=last.id;
  migrate(); save(); for(const k in SHOWN) delete SHOWN[k]; return n;
}

function choices(list,correct,ctx,{wide=false,cls='',explain,hint,voice,onPick}={}){
  const box=h('div',{class:'opts'+(wide?' wide':'')+(cls?' '+cls:'')});
  list.forEach(item=>{
    const obj=item&&typeof item==='object'&&!item.nodeType;
    const val=obj?item.value:item, lab=obj?item.label:String(item);
    const b=h('button',{class:'opt',onclick:()=>{
      if(val===correct){b.classList.add('ok');burst(b);box.querySelectorAll('.opt').forEach(x=>x.classList.add('lock'));onPick&&onPick(true,val);ctx.right(typeof explain==='function'?explain():explain,typeof voice==='function'?voice():voice);}
      else{b.classList.add('ko');onPick&&onPick(false,val);ctx.wrong(typeof hint==='function'?hint(val):hint);}
    }},lab);
    box.append(b);
  });
  return box;
}
function keypad(onKey){
  return h('div',{class:'keypad'},['1','2','3','4','5','6','7','8','9','del','0','ok'].map(c=>
    h('button',{class:'key'+(c==='del'?' del':c==='ok'?' ok':''),'aria-label':c==='del'?'Borrar':c==='ok'?'Comprobar':c,onclick:()=>{sfx.tap();onKey(c);}},c==='del'?'⌫':c==='ok'?'✓':c)));
}
function numAnswer(answer,ctx,{explain,hint,voice}={}){
  let val='',tries=0,clearNext=false;
  const disp=h('div',{class:'ans empty','aria-live':'polite'},'?');
  const max=Math.max(String(answer).length+1,3);
  const upd=()=>{disp.textContent=val||'?';disp.classList.toggle('empty',!val);};
  const kp=keypad(c=>{
    if(disp.classList.contains('good')) return;
    if(clearNext&&c!=='ok'){val='';clearNext=false;disp.classList.remove('bad');}
    if(c==='del') val=val.slice(0,-1);
    else if(c==='ok'){
      if(!val||clearNext) return;
      if(Number(val)===answer){disp.classList.add('good');ctx.right(typeof explain==='function'?explain():explain,voice);}
      else{tries++;disp.classList.remove('bad');void disp.offsetWidth;disp.classList.add('bad');clearNext=true;ctx.wrong(tries>=2?`Pista: es el ${answer}. Escríbelo.`:(typeof hint==='function'?hint(Number(val)):hint)||'');return;}
    }
    else if(val.length<max) val=(val==='0'?'':val)+c;
    upd();
  });
  return {disp,kp};
}

function words(n){if(n<30)return U[n];if(n<100){const t=Math.floor(n/10),u=n%10;return T[t]+(u?' y '+U[u]:'');}if(n===100)return 'cien';const c=Math.floor(n/100),r=n%100;return C[c]+(r?' '+words(r):'');}

function distract(d,pool,n,similar){
  const c=pool.filter(x=>x!==d&&!(d.twin&&x.twin===d.twin));
  const same=shuffle(c.filter(x=>x.look===d.look)),other=shuffle(c.filter(x=>x.look!==d.look));
  return (similar?[...same,...other]:[...other,...same]).slice(0,n);
}
const dinoOpts=(d,others,ctx,o)=>choices(shuffle([d,...others]).map(x=>({value:x.k,label:[dimg(x),vh(x.n)]})),d.k,ctx,{cls:'dinos'+(others.length>2?' four':''),...o});
const dhead=(d,big=true)=>[dimg(d,big?'big':''),h('div',{class:'with-say'},h('div',{class:'q-prompt'},d.n),sayBtn(d.n))];
const qline=(t,say=t)=>h('div',{class:'with-say'},h('div',{class:'q-prompt'},t),sayBtn(say));
function albumOf(p=me()){return (p&&p.album)||[];}
function unlockDino(k){const p=me(); if(!p||!DK[k]||!ALBUM.includes(DK[k])) return false; p.album=p.album||[]; if(p.album.includes(k)) return false; p.album.push(k); save(); return true;}
/* barras de tamaño para comparar */
function sizeBars(list){const max=Math.max(...list.map(d=>d.m));
  return h('div',{class:'bars'},list.map(d=>h('div',{class:'bar-row'},d.e?h('img',{class:'bar-img',src:d.e,alt:''}):h('span',{class:'bar-emo'},d.emo),
    h('div',{class:'bar'},h('i',{style:`width:${Math.max(3,d.m/max*100)}%`})),h('b',null,d.mt))));}

defGame({id:'memo',subject:'conoce',icon:'🃏',title:'Memory de dinos',desc:'Encuentra las parejas. Nivel 1: dinosaurio y sombra · Niveles 2 y 3: dinosaurio y nombre, con más cartas',
  custom(stage,run,ctx){
    const l=lvD(run),np=[6,8,10][l-1],ds=[];
    for(const d of shuffle(dinosL(l))) if(ds.length<np&&!ds.some(x=>d.twin&&x.twin===d.twin)) ds.push(d);   // sin los que se confunden a la vista
    const cards=shuffle(ds.flatMap((d,i)=>[{i,kind:'pic',d},{i,kind:l===1?'sil':'name',d}]));
    let open=[],lock=false,moves=0,found=0;
    const info=h('span',{class:'tag'},'Intentos: 0');
    const grid=h('div',{class:'memory dmemo'+(np>6?' big'+np:'')},cards.map(c=>{
      const face=c.kind==='name'?h('span',{class:'face nm'},c.d.n):h('span',{class:'face pic'},dimg(c.d,c.kind==='sil'?'sil':''));
      const b=h('button',{class:'card','aria-label':'Carta tapada',onclick:()=>{
        if(lock||b.classList.contains('up')||b.classList.contains('done')) return;
        sfx.pop();b.classList.add('up');b.setAttribute('aria-label',c.d.n);if(DB.sound) speak(c.d.n);open.push([b,c]);
        if(open.length<2) return;
        moves++;info.textContent='Intentos: '+moves;const [[b1,c1],[b2,c2]]=open;open=[];
        if(c1.i===c2.i){setTimeout(()=>{b1.classList.add('done');b2.classList.add('done');sfx.ok();found++;ctx.meter(found/np,0);unlockDino(c1.d.k);
          if(found===np){const st=moves<=np*1.5?3:moves<=np*2.2?2:1;setTimeout(()=>ctx.finish(st,`Has encontrado las ${np} parejas en ${moves} intentos.`),900);}},350);}
        else{lock=true;setTimeout(()=>{[b1,b2].forEach(x=>{x.classList.remove('up');x.setAttribute('aria-label','Carta tapada');});lock=false;},1150);}
      }},h('span',{class:'card-in'},h('span',{class:'backf','aria-hidden':'true'},h('img',{src:IMG.wave,alt:''})),face));
      return b;}));
    const ask=l===1?SAYD.memo1:SAYD.memo2;
    stage.append(qline(l===1?'Busca las parejas: dinosaurio y sombra':'Busca las parejas: dinosaurio y nombre',ask),info,grid);
    instr(ask);
  }});

/* ---------- Mi dinopedia (álbum) ---------- */
function fichaDino(d){
  document.querySelectorAll('.sheet').forEach(s=>s.remove());
  const close=()=>{stopVoice();sheet.remove();};
  const row=(ic,t)=>t?h('li',null,h('span',{class:'ic','aria-hidden':'true'},ic),h('span',null,t)):null;
  const lines=d.dino?[d.n,PER[d.per].s,DIET[d.diet].s,d.sz,d.wh,meanS(d),d.fact]:[d.n,d.fact];
  const say=()=>{sb.classList.add('on');speakSeq(lines,'es-ES',()=>sb.classList.remove('on'));};
  const sb=h('button',{class:'btn',onclick:say},'🔊 Escuchar');
  const sheet=h('div',{class:'sheet',onclick:e=>{if(e.target===sheet)close();}},
    h('div',{class:'ficha',role:'dialog','aria-label':'Ficha de '+d.n},
      dimg(d,'big'),h('h2',null,d.n),
      d.dino?h('ul',null,row('🕰️',PER[d.per].s),row('🍽️',DIET[d.diet].s),row('📏',d.sz),row('🌍',d.wh),row('🔤',meanS(d)),row('⭐',d.fact))
        :h('ul',null,row(d.yes?'🦖':'🚫',d.fact)),
      h('div',{class:'row center'},sb,h('button',{class:'btn ghost',onclick:close},'Cerrar'))));
  document.body.append(sheet); cleanup=close; if(DB.sound) say();
}

defGame({id:'tamano',subject:'como',icon:'📏',title:'¿Grande o pequeño?',desc:'¿Cuál era más largo? Nivel 2: ordénalos · Nivel 3: metros y comparaciones con un autobús',

    for(let i=0;i<9;i++){g2.fillStyle=pick(['rgba(160,120,80,.5)','rgba(185,150,105,.55)']);g2.beginPath();g2.ellipse(Math.random()*W,Math.random()*H,4+Math.random()*8,3+Math.random()*5,Math.random()*3,0,7);g2.fill();}

  requestAnimationFrame(()=>{if(done) return; if(!paint()) reveal();});
  setTimeout(()=>{if(!done&&box.isConnected) brush.hidden=false;},5000);

}

/* botón de escuchar que dice varias frases grabadas seguidas */
function seqBtn(lines){const b=h('button',{class:'say','aria-label':'Escuchar',onclick:()=>{b.classList.add('on');speakSeq(lines,undefined,()=>b.classList.remove('on'));}},ICO.sound());return b;}
/* ---------- monta el esqueleto: puzzle (como el de Mochila de 2º) ---------- */
const PBUILD={1:{g:3,ghost:true,rot:false},2:{g:4,ghost:false,rot:false},3:{g:4,ghost:false,rot:true}};
const PDECK={1:deck(PESQ[1]),2:deck(PESQ[2]),3:deck(PESQ[3])};
/* cómo se ve cada pieza: una rejilla de 10×10 brillos (sin su brillo medio, para que no cuente la luz de la losa),
   cuánto dibujo tiene (rough: la roca lisa da 2–5; con hueso, 9 o más) y su brillo medio */
function esqLook(img,G){
  const P=40,S=G*P,c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');x.drawImage(img,0,0,S,S);
  const d=x.getImageData(0,0,S,S).data,out=[];
  for(let t=0;t<G*G;t++){const tx=(t%G)*P,ty=Math.floor(t/G)*P,g=[];
    for(let by=0;by<10;by++)for(let bx=0;bx<10;bx++){let s=0;
      for(let yy=0;yy<4;yy++)for(let xx=0;xx<4;xx++){const i=((ty+by*4+yy)*S+tx+bx*4+xx)*4;s+=.3*d[i]+.59*d[i+1]+.11*d[i+2];}
      g.push(s/16);}
    const m=g.reduce((a,b)=>a+b)/g.length,gg=g.map(v=>v-m);
    out.push({g:gg,m,rough:gg.reduce((a,v)=>a+Math.abs(v),0)/gg.length});}
  return out;
}
const lookDist=(a,b)=>a.g.reduce((s,v,i)=>s+Math.abs(v-b.g[i]),0)/a.g.length;
/* grupos de piezas que se ven iguales (roca lisa): cualquiera de un grupo vale en el hueco de otra del mismo grupo.
   Se juntan con «unión de conjuntos» para que el puzzle siempre se pueda terminar. */
function esqGroups(look){
  const n=look.length,p=[...Array(n).keys()],f=i=>p[i]===i?i:(p[i]=f(p[i]));
  for(let a=0;a<n;a++)for(let b=a+1;b<n;b++) if(look[a].rough<=6&&look[b].rough<=6&&lookDist(look[a],look[b])<=6) p[f(a)]=f(b);
  return [...Array(n).keys()].map(f);
}
function esqFace(src,G,i,j){return h('span',{class:'pz-face',style:`background-image:url(${src});background-size:${G*100}% ${G*100}%;background-position:${i/(G-1)*100}% ${j/(G-1)*100}%`});}

defGame({id:'esqueleto',subject:'paleo',icon:'🧩',title:'Monta el esqueleto',desc:'Coloca las piezas y descubre de quién es. Nivel 2: 16 piezas · Nivel 3: el museo se ha equivocado, ¡encuentra la pieza que no es!',
  custom(stage,run,ctx){
    if((run.lvl||1)===3) return intruso(stage,run,ctx);
    const L=run.lvl||1,{g:G,ghost,rot:ROT}=PBUILD[L],N=G*G,d=DK[PDECK[L]()],src=esqImg(d.k);
    const timers=[];const later=(f,ms)=>timers.push(setTimeout(f,ms));
    cleanup=()=>{timers.forEach(clearTimeout);document.querySelectorAll('.pz-drag').forEach(x=>x.remove());};
    let grp=null,mistakes=0,placedN=0,sel=null,done=false,turnedMsg=0,hints=0;
    loadImg(src).then(im=>{try{grp=esqGroups(esqLook(im,G));}catch(e){grp=null;}}).catch(()=>{});
    const same=(t,r,k)=>r===0&&(t===k||!!(grp&&grp[t]===grp[k]));   // su hueco, o el de otra pieza de roca igual
    const filled=Array(N).fill(false);
    const grid=h('div',{class:'pz-cells',style:`grid-template-columns:repeat(${G},1fr)`});
    const cellEls=Array.from({length:N},(_,k)=>h('button',{class:'pz-cell','aria-label':'Hueco '+(k+1),onclick:()=>{if(sel&&!filled[k])tryPlace(sel,k);}}));
    grid.append(...cellEls);
    const board=h('div',{class:`pz-board build esq-board g${G}`+(ghost?' ghost':''),style:`--ar:1;--pz:url(${src})`},grid);
    const pieces=shuffle([...Array(N).keys()]).map((t,i)=>{
      const face=esqFace(src,G,t%G,Math.floor(t/G));
      const pc={t,r:0,face,placed:false,el:h('button',{class:'pz-piece','aria-label':'Pieza '+(i+1)},face)};drag(pc);return pc;});
    const tray=h('div',{class:'pz-tray g'+G,style:`--cols:${G}`},pieces.map(pc=>pc.el));
    const hover=k=>cellEls.forEach((c,j)=>c.classList.toggle('over',j===k&&!filled[j]));
    const dropCell=(pc,gr)=>{const r=grid.getBoundingClientRect(),s=r.width/G;let best=null,bo=0,right=null,ro=0;
      for(let k=0;k<N;k++){if(filled[k])continue;const x=r.left+(k%G)*s,y=r.top+Math.floor(k/G)*s;
        const ov=Math.max(0,Math.min(gr.right,x+s)-Math.max(gr.left,x))*Math.max(0,Math.min(gr.bottom,y+s)-Math.max(gr.top,y))/(s*s);
        if(ov>bo){bo=ov;best=k;} if(same(pc.t,pc.r,k)&&ov>ro){ro=ov;right=k;}}
      return right!=null&&ro>=.25?right:bo>=.4?best:null;};
    function select(pc){if(sel)sel.el.classList.remove('sel');sel=pc;if(pc)pc.el.classList.add('sel');board.classList.toggle('picking',!!pc);}
    function tapPiece(pc){
      if(done||pc.placed) return;
      if(ROT){pc.r=(pc.r+1)%4;pc.face.style.transform=`rotate(${pc.r*90}deg)`;sfx.tap();select(pc);return;}
      if(sel===pc){select(null);sfx.tap();return;}
      select(pc);sfx.pop();
    }
    function drag(pc){
      let sx=0,sy=0,pid=null,moving=false,gh=null;
      pc.el.addEventListener('pointerdown',e=>{if(done||pc.placed)return;e.preventDefault();pid=e.pointerId;sx=e.clientX;sy=e.clientY;moving=false;try{pc.el.setPointerCapture(pid);}catch(x){}});
      pc.el.addEventListener('pointermove',e=>{
        if(e.pointerId!==pid||pc.placed) return;
        if(!moving&&Math.hypot(e.clientX-sx,e.clientY-sy)>8){moving=true;const s=grid.getBoundingClientRect().width/G,f=esqFace(src,G,pc.t%G,Math.floor(pc.t/G));f.style.transform=`rotate(${pc.r*90}deg)`;
          gh=h('div',{class:'pz-drag',style:`width:${s}px;height:${s}px`},f);document.body.append(gh);pc.el.classList.add('lifted');}
        if(moving){gh.style.transform=`translate(${e.clientX-gh.offsetWidth/2}px,${e.clientY-gh.offsetHeight/2}px)`;hover(dropCell(pc,gh.getBoundingClientRect()));}
      });
      const end=e=>{
        if(e.pointerId!==pid) return; pid=null;
        if(moving){moving=false;const k=e.type==='pointerup'&&gh?dropCell(pc,gh.getBoundingClientRect()):null;if(gh){gh.remove();gh=null;}pc.el.classList.remove('lifted');hover(null);
          if(k!=null&&!filled[k]) tryPlace(pc,k);}
        else if(e.type==='pointerup') tapPiece(pc);
      };
      pc.el.addEventListener('pointerup',end); pc.el.addEventListener('pointercancel',end);
      pc.el.addEventListener('click',e=>{if(e.detail===0)tapPiece(pc);});
    }
    function tryPlace(pc,k){
      if(done||pc.placed||filled[k]) return;
      if(same(pc.t,pc.r,k)){
        filled[k]=true; pc.placed=true; placedN++; select(null); pc.el.classList.add('gone'); pc.el.disabled=true;
        cellEls[k].classList.add('filled'); cellEls[k].append(esqFace(src,G,k%G,Math.floor(k/G))); sfx.pop(); burst(cellEls[k]);
        ctx.meter(placedN/N,0); if(placedN===N) win(); return;
      }
      if(pc.t===k){sfx.ko();showToast('¡Casi!',PSAY.turned);if(DB.sound&&turnedMsg++<3)speak(PSAY.turned);return;}
      mistakes++; sfx.ko(); const c=cellEls[k]; c.classList.remove('nope'); void c.offsetWidth; c.classList.add('nope');
      if(mistakes<=2||mistakes%4===0){showToast('Ahí no va',PSAY.notHere);if(DB.sound)speak(PSAY.notHere);}
    }
    function win(){
      done=true; const st=mistakes<=2&&!hints?3:mistakes<=N?2:1;
      board.classList.add('solved'); sfx.win(); confetti(); unlockDino(d.k);
      const say=[PSAY.built,esqSay(d),ESQ_PISTA[d.k]];
      const go=h('button',{class:'btn big',style:'--c:var(--paleo)',onclick:()=>{sfx.pop();stopVoice();ctx.finish(st,`Has montado el esqueleto del ${d.n} ${mistakes?`con ${mistakes} ${mistakes===1?'fallo':'fallos'}`:'sin ningún fallo'}.`);}},'¡Seguir! ▶');
      const hecho=h('div',{class:'esq-done'},dimg(d,'big'),h('div',{class:'with-say'},h('div',{class:'q-prompt'},`Es el ${d.n}`),seqBtn(say)),go);
      tray.replaceWith(hecho);
      later(()=>{if(hecho.isConnected) hecho.scrollIntoView({behavior:reduced?'auto':'smooth',block:'nearest'});},450);   // que se vea «¡Seguir!» aunque la pantalla sea alta y estrecha
      if(DB.sound) later(()=>speakSeq(say),600);
    }
    run.data.solve=()=>{pieces.forEach(pc=>{pc.r=0;pc.face.style.transform='';tryPlace(pc,pc.t);});};   // para las pruebas
    const say=ROT?PSAY.buildRot:PSAY.build;
    const hintB=h('button',{class:'btn ghost',onclick:()=>{if(done)return;const left=pieces.filter(pc=>!pc.placed);if(!left.length)return;
      const pc=sel&&!sel.placed?sel:pick(left);hints++;sfx.pop();select(pc);pc.el.scrollIntoView({block:'nearest'});
      const k=!filled[pc.t]?pc.t:cellEls.findIndex((c,j)=>!filled[j]&&same(pc.t,0,j));   // un hueco libre donde encaja
      cellEls.forEach(c=>c.classList.remove('hint'));if(k<0) return;cellEls[k].classList.add('hint');later(()=>cellEls[k].classList.remove('hint'),2600);}},'💡 Pista');
    stage.append(h('div',{class:'pz-wrap build'},h('div',{class:'pz-main'},h('div',{class:'with-say'},h('div',{class:'q-prompt'},ROT?'Gira y coloca las piezas':'Coloca las piezas del esqueleto'),sayBtn(say)),board,hintB),tray));
    instr(say);
  }});

/* ---------- nivel 3 de Monta el esqueleto: «el museo se ha equivocado» ----------
   El esqueleto lleva una pieza de otro dinosaurio (la que más huesos tiene en los dos dibujos). Primero se busca la pieza
   y después se dice de quién es el esqueleto. Cuatro esqueletos por partida. */
const loadImg=src=>new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=src;});
const pieceSay=d=>`La pieza equivocada era del ${d.n}.`;
const INT_DECK=deck([...PESQ[1],...PESQ[2],...PESQ[3]]);
const INT_GRP={trex:'ter',velocirraptor:'ter',espinosaurio:'ter',estegosaurio:'cua',anquilosaurio:'cua',triceratops:'cua',braquiosaurio:'cue',parasaurolofo:'orn',paquicefalosaurio:'orn'};
function intruso(stage,run,ctx){
  const ROUNDS=4,G=4,all=[...PESQ[1],...PESQ[2],...PESQ[3]];
  let r=0,errs=0;const timers=[];const later=(f,ms)=>timers.push(setTimeout(f,ms));
  cleanup=()=>timers.forEach(clearTimeout);
  const area=h('div',{class:'intruso'});stage.append(area);
  const fin=()=>{const st=errs<=1?3:errs<=4?2:1;
    ctx.finish(st,`Has encontrado las ${ROUNDS} piezas equivocadas ${errs?`con ${errs} ${errs===1?'fallo':'fallos'}`:'sin ningún fallo'}.`);};
  async function ronda(){
    if(RUN!==run) return;
    const a=DK[INT_DECK()],b=DK[pick(all.filter(k=>INT_GRP[k]!==INT_GRP[a.k]))];   // de un dinosaurio con otra forma de cuerpo
    let t=5,tono=1;
    try{const [ia,ib]=await Promise.all([loadImg(esqImg(a.k)),loadImg(esqImg(b.k))]);const la=esqLook(ia,G),lb=esqLook(ib,G);
      let best=-1;for(const k of [1,2,4,5,6,7,8,9,10,11,13,14]){if(lb[k].rough<9) continue;   // la pieza mala tiene que tener huesos
        const v=lookDist(la[k],lb[k])+(la[k].rough>=9?6:0);if(v>best){best=v;t=k;}}   // la que más cambia el esqueleto
      const roca=l=>{const p=l.filter(x=>x.rough<=6).map(x=>x.m).sort((x,y)=>x-y);return p.length?p[p.length>>1]:l[0].m;};
      tono=roca(la)/roca(lb);}catch(e){}   // mismo tono de roca: que la delaten los huesos, no el color
    if(RUN!==run) return;
    let found=false;
    const tiles=Array.from({length:G*G},(_,k)=>{const el=h('button',{class:'pz-cell filled int-cell','aria-label':'Pieza '+(k+1),onclick:()=>{
        if(found) return;
        if(k===t){found=true;el.classList.add('mala');sfx.ok();burst(el);paso2();}
        else{errs++;sfx.ko();el.classList.remove('nope');void el.offsetWidth;el.classList.add('nope');showToast('Esa no',PSAY.intrusoNo);if(DB.sound)speak(PSAY.intrusoNo);}}},
      (()=>{const f=esqFace(esqImg(k===t?b.k:a.k),G,k%G,Math.floor(k/G));if(k===t&&Math.abs(tono-1)>.01)f.style.filter=`brightness(${tono.toFixed(3)})`;return f;})());return el;});
    const board=h('div',{class:'pz-board build esq-board int-board',style:'--ar:1'},h('div',{class:'pz-cells',style:`grid-template-columns:repeat(${G},1fr)`},tiles));
    const side=h('div',{class:'int-side'},h('div',{class:'with-say'},h('div',{class:'q-prompt'},'Una pieza es de otro dinosaurio: ¡encuéntrala!'),sayBtn(PSAY.intruso)),
      h('p',{class:'q-note'},`Esqueleto ${r+1} de ${ROUNDS}`));
    area.replaceChildren(h('div',{class:'pz-wrap build'},h('div',{class:'pz-main'},board),side));
    if(scrollY>0) scrollTo({top:0,behavior:reduced?'auto':'smooth'});   // el esqueleto nuevo, a la vista
    instr(PSAY.intruso);
    function paso2(){
      const others=pickN(all.filter(k=>k!==a.k&&k!==b.k),2).map(k=>DK[k]);
      const stub={right:()=>{sfx.ok();r++;ctx.meter(r/ROUNDS,0);unlockDino(a.k);
          const say=[pick(PRAISE),esqSay(a),pieceSay(b)];showToast(say[0],`${esqSay(a)} ${pieceSay(b)}`);if(DB.sound)speakSeq(say);
          later(()=>{if(RUN===run){r>=ROUNDS?fin():ronda();}},DB.sound?4600:2200);},
        wrong:()=>{errs++;sfx.ko();const m=pick(RETRY);showToast(m,'Mira la cabeza, la espalda y la cola.');if(DB.sound)speak(m);}};
      side.replaceChildren(h('div',{class:'with-say'},h('div',{class:'q-prompt'},'¡Bien visto! Esa pieza es de otro dinosaurio.'),sayBtn(PSAY.intrusoOk)),
        qline('¿Y de quién es el esqueleto?',PSAY.esq2),
        choices(shuffle([a,...others]).map(x=>({value:x.k,label:[dimg(x),vh(x.n)]})),a.k,stub,{cls:'dinos'}));
      if(DB.sound) speakSeq([PSAY.intrusoOk,PSAY.esq2]);
      later(()=>{if(side.isConnected) side.scrollIntoView({behavior:reduced?'auto':'smooth',block:'nearest'});},300);   // la pregunta sale debajo: que se vea
    }
  }
  ronda();
}

/* ---------- sigue las huellas ---------- */
/* up: 1 si los dedos del dibujo miran hacia arriba, -1 si miran hacia abajo */
const PHU={
  tres:{img:'img/p-huella-tres.webp',up:1,pool:['trex','alosaurio','dilofosaurio','carnotauro','giganotosaurio','celofisis'],

  sauro:{img:'img/p-huella-sauropodo.webp',up:-1,pool:['braquiosaurio','diplodoco','brontosaurio','argentinosaurio','mamenquisaurio','turiasaurio'],

/* lo que explica Mochi en cada escena */
const PHUW={
  caza:'Los dedos apuntan hacia donde iban. Los dos van hacia el mismo lado y el carnívoro va detrás del herbívoro: parece que lo seguía.',
  crias:'Hay huellas grandes y pequeñas que van juntas hacia el mismo lado: era una manada con adultos y crías.',

  para:'Las dos últimas huellas están una al lado de la otra: se paró.',
  vuelta:'Las huellas hacen una curva y vuelven hacia atrás: dio la vuelta.',
  antes:{tres:'Una huella de tres dedos pisa a una huella redonda: el de las huellas redondas pasó antes.',sauro:'Una huella redonda pisa a una huella de tres dedos: el de las huellas de tres dedos pasó antes.'},
  rapido:{up:'Iba más deprisa el de arriba: sus huellas están más separadas porque daba pasos más largos.',down:'Iba más deprisa el de abajo: sus huellas están más separadas porque daba pasos más largos.'},
};
const PASO_L={caza:'🦖 Un carnívoro seguía a un herbívoro',herb:'🦕 Un herbívoro seguía a un carnívoro',crias:'👨‍👩‍👧 Una manada con adultos y crías'};
const HIZO_L={acelera:'🏃 Empezó a correr',para:'🛑 Se paró',vuelta:'↩️ Dio la vuelta'};
/* nivel 3: con lo que mide la huella se calcula la altura de la cadera (unas 4 veces más) */
const CADERA=[
  {cm:25,q:'Esta huella mide 25 centímetros. ¿A qué altura tenía la cadera?',a:'1 metro',w:['25 centímetros','10 metros'],why:'25 por 4 son 100 centímetros: su cadera estaba a 1 metro del suelo.'},
  {cm:50,q:'Esta huella mide 50 centímetros. ¿A qué altura tenía la cadera?',a:'2 metros',w:['50 centímetros','20 metros'],why:'50 por 4 son 200 centímetros: su cadera estaba a 2 metros del suelo.'},
  {cm:75,q:'Esta huella mide 75 centímetros. ¿A qué altura tenía la cadera?',a:'3 metros',w:['75 centímetros','30 metros'],why:'75 por 4 son 300 centímetros: su cadera estaba a 3 metros del suelo, casi tan alta como una canasta de baloncesto.'},
];
/* pisadas dibujadas (con los dedos hacia arriba) para que se vea bien hacia dónde van, aunque sean pequeñas */
const PSVG={
  tres:'<path d="M50 66 L50 12 M45 66 L22 26 M55 66 L78 26" stroke-width="11"/><path d="M50 2 L44 14 L56 14Z M14 18 L18 31 L27 25Z M86 18 L73 25 L82 31Z"/><ellipse cx="50" cy="72" rx="15" ry="13"/>',
  romo:'<path d="M50 60 L50 26 M43 64 L28 38 M57 64 L72 38" stroke-width="21"/><ellipse cx="50" cy="70" rx="21" ry="17"/>',

  sauro:'<ellipse cx="50" cy="58" rx="34" ry="30"/><ellipse cx="29" cy="25" rx="6" ry="5"/><ellipse cx="50" cy="20" rx="6" ry="5"/><ellipse cx="71" cy="25" rx="6" ry="5"/>',

/* una pisada: x, y en % del barro; rot en grados (0 = dedos hacia arriba, 90 = hacia la derecha) */
function pisada(kind,x,y,sz,rot,delay,cls){
  const s=h('span',{class:'pisada'+(cls?' '+cls:''),style:`left:${x}%;top:${y}%;width:${sz}%;transform:translate(-50%,-50%) rotate(${rot}deg);animation-delay:${delay.toFixed(2)}s`});
  s.innerHTML=`<svg viewBox="0 0 100 100"><g fill="currentColor" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">${PSVG[kind]}</g></svg>`;
  return s;
}
/* un camino recto, alternando pie izquierdo y derecho; gaps: un paso fijo o una lista de pasos */
function fila(kind,{y,dir=1,gaps=13,sz=9,x0,x1,delay=0}){
  const out=[],from=x0!=null?x0:(dir>0?6:94),to=x1!=null?x1:(dir>0?94:6);
  for(let i=0,x=from;dir>0?x<=to:x>=to;i++){out.push(pisada(kind,x,y+(i%2?1:-1)*sz*.32,sz,dir*90,delay+i*.14));x+=dir*(Array.isArray(gaps)?(gaps[i]||gaps[gaps.length-1]):gaps);}
  return out;
}
const barro=(...els)=>h('div',{class:'barro','aria-hidden':'true'},...els.flat());
function escena(q){
  const dir=q.dir||1,X=x=>dir>0?x:100-x;
  if(q.a==='caza') return barro(fila('sauro',{y:40,dir,gaps:14,sz:9,x0:X(40)}),fila('tres',{y:60,dir,gaps:12,sz:8,x0:X(6),x1:X(70),delay:.6}));
  if(q.a==='crias') return barro(fila('sauro',{y:24,dir,gaps:15,sz:10}),fila('sauro',{y:50,dir,gaps:9,sz:5.5,delay:.3}),fila('sauro',{y:76,dir,gaps:15,sz:10,delay:.15}));
  if(q.a==='acelera') return barro(fila('tres',{y:50,dir,gaps:[6,7,9,11,14,18,23],sz:8}));
  if(q.a==='para'){const xs=[6,18,30,42,54,66],sz=9;
    return barro(xs.map((x,i)=>pisada('tres',X(x),i===xs.length-1?42:50+(i%2?1:-1)*sz*.32,sz,dir*90,i*.14)),pisada('tres',X(66),58,sz,dir*90,xs.length*.14));}   // las dos últimas, una al lado de la otra
  if(q.a==='vuelta'){const sz=8,out=[];let i=0;
    for(let x=8;x<=72;x+=11,i++) out.push(pisada('tres',X(x),30+(i%2?1:-1)*sz*.3,sz,dir*90,i*.14));
    for(const a of [-50,0,50]){const r=a*Math.PI/180,x=74+12*Math.cos(r),y=52+22*Math.sin(r),rot=Math.atan2(-Math.sin(r),-Math.cos(r))*180/Math.PI;   // la curva, girando poco a poco
      out.push(pisada('tres',X(x),y,sz,dir>0?rot:-rot,i++*.14));}
    for(let x=72;x>=8;x-=11,i++) out.push(pisada('tres',X(x),74+(i%2?1:-1)*sz*.3,sz,-dir*90,i*.14));
    return barro(out);}
  return null;
}
/* dos caminos que se cruzan: el de encima pasó después y su huella tapa un poco la de debajo */
function cruce(later){
  const sau=[8,22,36,50,64,78,92].map((x,i)=>pisada('sauro',x,50+(x===50?0:(i%2?1:-1)*3),9,90,i*.14,later==='sauro'&&x===50?'encima':''));
  const tre=[82,66,46,30,14].map((y,i)=>pisada('tres',50+(y===46?0:(i%2?1:-1)*2.5),y,7,0,.4+i*.14,later==='tres'&&y===46?'encima':''));   // se cruzan un poco desplazadas, para que asome la de debajo
  return later==='tres'?barro(sau,tre):barro(tre,sau);
}
const quienHuella=(kind,others)=>{const k=PHU[kind],d=DK[pick(k.pool)];
  return {n:d.k,d,kind,others:others.map(o=>DK[pick(PHU[o].pool)])};};

defGame({id:'huellas',subject:'paleo',icon:'🐾',title:'Sigue las huellas',desc:'¿Quién dejó esta huella? Nivel 2: lee lo que pasó (persecuciones, manadas, carreras) · Nivel 3: mide y calcula como un paleontólogo',rounds:8,
  prepare(run){const l=lvD(run);
    run.data.modes=l===1?Array(8).fill('quien'):l===2?shuffle(['caza','crias','hizo','hizo','caza','crias','hizo','hizo']):shuffle(['cadera','antes','cadera','rapido','cadera','antes','rapido','cadera']);

        qline(c.q),choices(shuffle([c.a,...c.w]).map(t=>({value:t,label:t})),c.a,ctx,{wide:true,explain:c.why,voice:{post:c.why},hint:'Multiplica lo que mide la huella por 4.'}));
      instr(PSAY.truco,c.q); return;}
    let ask,mud,opts;
    if(q.mode==='paso'){ask=PSAY.paso;mud=escena(q);
      opts=choices(shuffle(Object.keys(PASO_L)).map(k=>({value:k,label:PASO_L[k]})),q.a,ctx,{wide:true,explain:PHUW[q.a],voice:{post:PHUW[q.a]},hint:'Mira qué huellas hay, hacia dónde van y cuáles van delante.'});}

    else if(q.mode==='antes'){ask=PSAY.antes;mud=cruce(q.later);const right=q.later==='tres'?'sauro':'tres',w=PHUW.antes[q.later];
      opts=choices([{value:'sauro',label:'⚫ El de las huellas redondas'},{value:'tres',label:'🦖 El de las huellas de tres dedos'}],right,ctx,{wide:true,explain:w,voice:{post:w},hint:'Mira dónde se cruzan: ¿qué huella está encima?'});}
    else{ask=PSAY.rapido;const fast=26,slow=11;

    stage.append(mud,qline(ask),opts);

  }});

/* ---------- el trabajo del paleontólogo ---------- */
const PTOOL={pincel:'🖌️ Pincel',lupa:'🔍 Lupa',martillo:'🔨 Martillo',pala:'🪏 Pala',regla:'📏 Regla',cuaderno:'📒 Cuaderno',casco:'⛑️ Casco',camara:'📷 Cámara'};
const POF1=[

  {q:'¿Por qué envuelven los huesos en yeso?',a:'Para que no se rompan por el camino',w:['Para que no pasen frío','Para pintarlos de blanco'],why:'El yeso se pone duro y protege los huesos, como la escayola de un brazo roto.'},

];

/* tocar los pasos en orden: cada uno se apunta en la lista y Mochi lo lee */
function ordenar(steps,ctx,ok,hint,{silent=false,onTap=null}={}){
  let k=0;const list=h('ol',{class:'pasos-hechos'});
  const pool=h('div',{class:'pasos'},shuffle(steps).map(s=>{const b=h('button',{class:'paso',onclick:()=>{
    if(b.disabled||k>=steps.length) return; onTap&&onTap();
    if(s===steps[k]){b.disabled=true;b.classList.add('used');list.append(h('li',null,h('span',{class:'paso-e','aria-hidden':'true'},typeof s.e==='string'?s.e:s.e.cloneNode(true)),h('span',null,s.t)));k++;sfx.pop();
      if(k===steps.length){burst(list);ctx.right(steps.map(x=>x.t).join(' → '),{post:ok});} else if(DB.sound&&!silent) speak(s.t);}
    else{b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');ctx.wrong(hint);}
  }},h('span',{class:'paso-e','aria-hidden':'true'},s.e),h('span',null,s.t));return b;}));
  return [list,pool];
}
defGame({id:'oficio',subject:'paleo',icon:'🖌️',title:'¿Qué hace un paleontólogo?',desc:'Sus herramientas. Nivel 2: los pasos de una excavación · Nivel 3: cómo se forma un fósil',rounds:8,

<script>

  {k:'huellas',a:'rioja',p:'Aquí no hay esqueletos famosos, pero sí miles de huellas de dinosaurio. Es la más pequeña de las cinco provincias.'},
];
const ESP_SAY={cuenca:'Eso es Cuenca.',teruel:'Eso es Teruel.',castellon:'Eso es Castellón.',burgos:'Eso es Burgos.',rioja:'Eso es La Rioja.'};
const RIOJA_WHY='En Enciso, en La Rioja, hay miles de huellas de dinosaurio: es uno de los mejores sitios de Europa para verlas.';
function espana(onTap){const E=MAPAS.espana;
  const svg=sv('svg',{class:'mapa espana',viewBox:`0 0 ${E.w} ${E.h}`,role:'img','aria-label':'Mapa de España'});
  svg.append(sv('rect',{x:0,y:0,width:E.w,height:E.h,rx:18,class:'mar'}),sv('path',{d:E.p.otras,class:'prov'}));
  Object.keys(ESP_N).forEach(k=>{svg.append(sv('path',{d:E.p[k],class:'prov fosil','data-p':k,onclick:()=>onTap(k)}));});
  Object.keys(ESP_N).forEach(k=>{const [x,y]=E.cent[k];svg.append(sv('text',{x,y:y+5,class:'rotulo prov-n','text-anchor':'middle'},ESP_N[k]));});
  return svg;}
const PANGEA_Q={q:'¿Por qué se encuentran Alosaurios en Portugal y también en Norteamérica, con un océano en medio?',a:'Porque entonces los continentes estaban juntos',
  w:['Porque cruzaban el océano nadando','Porque los llevaron en barco'],why:'Hace unos 150 millones de años, Norteamérica y Europa casi se tocaban. Después los continentes se separaron y entre ellos se abrió el océano Atlántico.'};
const FRIO_Q={q:'Se encontró un Criolofosaurio en la Antártida. ¿Cómo es posible, con tanto hielo?',a:'Entonces no estaba helada: el clima era mucho más cálido',
  w:['Los dinosaurios llevaban abrigo','Lo llevaron allí en barco'],why:'En el Jurásico, en la Antártida había bosques. El hielo llegó muchísimo después.'};
function pangeaPuzzle(stage,ctx,onDone){const P=MAPAS.pangea;
  let sel=null,left=Object.keys(P.p).length;
  const svg=sv('svg',{class:'mapa pangea',viewBox:`0 0 ${P.w} ${P.h}`,role:'img','aria-label':'Pangea'});
  svg.append(sv('rect',{x:0,y:0,width:P.w,height:P.h,rx:18,class:'mar'}));
  const tray=h('div',{class:'pangea-piezas'});
  Object.entries(P.p).forEach(([k,p])=>{
    const ghost=sv('g',{transform:`translate(${p.x},${p.y})`,class:'hueco','data-k':k,onclick:()=>{
      if(ghost.classList.contains('puesto')) return;   // ese sitio ya está ocupado
      if(!sel){sfx.tap();showToast('Primero, un continente','Toca un continente de abajo y después su sitio.');return;}
      if(sel.dataset.k===k){ghost.setAttribute('class','puesto c-'+k);sel.remove();sel=null;sfx.pop();left--;
        if(!left){svg.classList.add('hecha');onDone(svg);}}
      else{sel.classList.remove('shake');void sel.offsetWidth;sel.classList.add('shake');ctx.wrong(CSAY.pangeaNo);if(DB.sound)setTimeout(()=>speak(CSAY.pangeaNo),900);}}},
      sv('path',{d:p.d,class:'borde'}),sv('path',{d:p.d,class:'relleno'}));
    svg.append(ghost);
    const t=sv('svg',{viewBox:p.bb.join(' '),class:'pieza-svg c-'+k},sv('path',{d:p.d,class:'borde'}),sv('path',{d:p.d,class:'relleno'}));
    const b=h('button',{class:'pangea-pieza','data-k':k,'aria-label':p.n,onclick:()=>{sfx.tap();if(sel)sel.classList.remove('sel');sel=sel===b?null:b;if(sel)sel.classList.add('sel');}},t,h('span',null,p.n));
    tray.append(b);});
  stage.append(svg,tray);
}
defGame({id:'mapa',subject:'cuando',icon:'🗺️',title:'¿Dónde se encontró?',desc:'Los dinosaurios en el mapa del mundo. Nivel 2: pistas de viajero · Nivel 3: el mapa de España y Pangea',rounds:8,
  prepare(run){const l=lvD(run);
    if(l===1){run.data.list=shuffle([...MAPA1_FIJOS,pick(MAPA1_MAS)]);return;}
    if(l===2){run.data.list=pickN(PISTAS,8);return;}
    run.total=6;const es=pickN(ESP,4);run.data.list=[es[0],es[1],{mode:'pangea'},es[2],es[3],{mode:'frio'}];},
  make(run){const l=lvD(run),x=run.data.list[run.i];
    if(l===1) return {mode:'mundo',n:x,d:DK[x],c:CONT_DE[x]};
    if(l===2) return {mode:'pistas',n:x.k,...x};
    return x.mode?x:{mode:'es',n:DK[x.k]?x.k:null,...x};},
  render(q,stage,ctx){
    if(q.mode==='mundo'){const d=q.d;let svg;
      svg=mundo(c=>{if(svg.classList.contains('hecho')) return;
        if(c===q.c){svg.classList.add('hecho');svg.querySelector('.c-'+c).classList.add('bien');rotulo(svg,c);const [x,y]=MAPAS.mundo.marca[d.k];marca(svg,x,y,d.e);
          ctx.right(`${d.n}. ${d.wh}`,{post:[d.n,d.wh]});}
        else{const el=svg.querySelector('.c-'+c);el.classList.remove('nope');void el.getBBox;el.classList.add('nope');setTimeout(()=>el.classList.remove('nope'),700);ctx.wrong(ESO_ES[c]);}});
      stage.append(h('div',{class:'mapa-cabeza'},dimg(d),h('div',null,h('div',{class:'q-prompt'},d.n),h('p',{class:'pista-txt'},d.wh))),qlineS(DONDE_ESTA[q.c].replace('¿Dónde está ','Toca ').replace('?',' en el mapa'),[d.n,d.wh,DONDE_ESTA[q.c]]),h('div',{class:'mapa-caja'},svg));
      instr(d.n,d.wh,DONDE_ESTA[q.c]);return;}
    if(q.mode==='pistas'){const d=DK[q.k];
      stage.append(h('div',{class:'mapa-cabeza'},dimg(d),h('div',null,h('div',{class:'q-prompt'},`¿Dónde se encontró el ${d.n}?`),h('ol',{class:'pistas-lista'},q.p.map(t=>h('li',null,t))))),
        h('div',{class:'with-say pistas-say'},h('span',{class:'q-note'},'Junta las tres pistas'),seqBtn([CSAY.mapa2,...q.p])),
        choices(shuffle([q.a,...q.o]).map(v=>({value:v,label:LUGAR[v]})),q.a,ctx,{wide:true,explain:`${d.n}. ${d.wh}`,voice:{post:[d.n,d.wh]},hint:'Comprueba las tres pistas con ese sitio.'}));
      instr(CSAY.mapa2,...q.p);return;}
    if(q.mode==='es'){const d=DK[q.k],img=d?d.e:'img/p-huella-tres.webp',n=d?d.n:'Las huellas';let svg;
      svg=espana(p=>{if(svg.classList.contains('hecho')) return;
        if(p===q.a){svg.classList.add('hecho');svg.querySelector(`[data-p="${p}"]`).classList.add('bien');
          ctx.right(d?`${d.n}. ${d.wh}`:RIOJA_WHY,{post:d?[d.n,d.wh]:[RIOJA_WHY]});}
        else{const el=svg.querySelector(`[data-p="${p}"]`);el.classList.remove('nope');void el.getBBox;el.classList.add('nope');setTimeout(()=>el.classList.remove('nope'),700);ctx.wrong(ESP_SAY[p]);}});
      stage.append(h('div',{class:'mapa-cabeza'},h('img',{class:'dino',src:img,alt:''}),h('div',null,h('div',{class:'q-prompt'},n),h('p',{class:'pista-txt'},q.p))),
        qlineS('¿En qué provincia?',[CSAY.mapa3,...(d?[d.n]:[]),q.p]),h('div',{class:'mapa-caja'},svg));
      instr(CSAY.mapa3,d?d.n:null,q.p);return;}
    if(q.mode==='pangea'){
      stage.append(qlineS('Monta Pangea',CSAY.pangea));
      pangeaPuzzle(stage,ctx,svg=>{const A=MAPAS.pangea.alo;marca(svg,A.pt[0],A.pt[1],DK.alosaurio.e);marca(svg,A.na[0],A.na[1],DK.alosaurio.e);
        if(DB.sound) speakSeq([CSAY.pangeaOk,PANGEA_Q.q]);
        const box=h('div',{class:'pangea-preg'},qlineS(PANGEA_Q.q),choices(shuffle([PANGEA_Q.a,...PANGEA_Q.w]).map(t=>({value:t,label:t})),PANGEA_Q.a,ctx,{wide:true,explain:PANGEA_Q.why,voice:{post:PANGEA_Q.why},hint:'Mira dónde están los dos Alosaurios en Pangea.'}));
        stage.append(box);box.scrollIntoView({behavior:reduced?'auto':'smooth',block:'nearest'});});
      instr(CSAY.pangea);return;}
    /* frio */
    const svg=mundo(null);svg.querySelector('.c-an').classList.add('bien');const [x,y]=MAPAS.mundo.marca.criolofosaurio;marca(svg,x,y,DK.criolofosaurio.e);
    stage.append(h('div',{class:'mapa-caja'},svg),qlineS(FRIO_Q.q),choices(shuffle([FRIO_Q.a,...FRIO_Q.w]).map(t=>({value:t,label:t})),FRIO_Q.a,ctx,{wide:true,explain:FRIO_Q.why,voice:{post:FRIO_Q.why},hint:'Piensa cómo era el clima entonces.'}));
    instr(FRIO_Q.q);
  }});

/* ---------- todo lo que dice Mochi en esta sección (para grabarlo) ---------- */
const CUANDO_VOICE=()=>{
  const nuevos=DINOS.filter(d=>d.l===0);
  return {
    'dino-cuando':[...new Set([...Object.values(CSAY),...ERAS.flatMap(e=>[ERA[e].es,ERA[e].si]),...Object.values(MOM).map(m=>m.cuando),
      ...ORD1.flatMap(o=>Object.values(o)),...REGLA.flatMap(r=>[r.q,r.why]),...VIAJE1.flatMap(v=>[v.s,v.why]),...Object.values(VIAJE2),
      ...PAREJAS.map(p=>p.why),...Object.values(COLADO_WHY),...Object.values(PLANTA_MAL).flatMap(p=>[p.q,p.why]),MAMIFERO_SI,
      ...Object.values(DONDE_ESTA),...Object.values(ESO_ES),...PISTAS.flatMap(p=>p.p),...ESP.map(e=>e.p),...Object.values(ESP_SAY),RIOJA_WHY,
      PANGEA_Q.q,PANGEA_Q.why,FRIO_Q.q,FRIO_Q.why,COSA.personas.n,
      ...nuevos.flatMap(d=>[d.n,d.sz,d.wh,meanS(d),d.fact])])],
  };};
</script>
<script>
"use strict";
/* ================= PORTADA DE MOCHI DINOSAURIOS =================
   Solo en esta app se cambia la pantalla de inicio del motor (goHome). La Mochila sigue con la suya.
   La portada tiene tres partes:
   · el valle, con Mochi y dinosaurios que dicen su nombre al tocarlos (son nombres ya grabados);
   · las secciones abiertas, con todos sus juegos a la vista;
   · los huevos: secciones que llegan pronto o que se abren al conseguir un trofeo (cada uno con sus frases grabadas). */
const VALLE=[   // x: centro (% desde la izquierda) · b/t: % desde abajo/arriba · hh: alto (% del valle)
  {k:'braquiosaurio',x:81,b:13,hh:76},
  {k:'pterodactilo',x:85,t:7,hh:26,vuela:1},   // el Pteranodon: grande, llega volando y planea
  {k:'trex',x:47,b:5,hh:47},
  {k:'estegosaurio',x:66,b:3,hh:27},
  {k:'triceratops',x:29,b:3,hh:31},
];
/* sid/need: la sección sid sale de su huevo cuando el jugador consigue el trofeo (nivel 1) de need */
const PRONTO=[
  {sid:'cuando',need:'conoce',name:'Cuándo y dónde',egg:'img/huevo-morado.webp',
    say:'En este huevo están los juegos de cuándo y dónde vivieron los dinosaurios. Se abrirá cuando consigas todas las estrellas de Conoce a los dinos.',
    ready:'¡Mira! El huevo morado se está moviendo. ¡Tócalo para abrirlo!',
    hatch:'¡Ha salido una sección nueva: Cuándo y dónde! Vamos a viajar en el tiempo y por el mapa.'},
  {sid:'paleo',need:'como',name:'Paleontólogos',egg:'img/huevo-azul.webp',
    say:'En este huevo están los juegos de paleontólogos. Se abrirá cuando consigas todas las estrellas de Cómo eran.',
    ready:'¡Mira! El huevo azul se está moviendo. ¡Tócalo para abrirlo!',
    hatch:'¡Ha salido una sección nueva: Paleontólogos! Vamos a excavar fósiles y a montar esqueletos.'},
  {name:'Cuentos de Mochi',egg:'img/huevo-naranja.webp',say:'En este huevo están los cuentos de Mochi. ¡Muy pronto se abrirá!'},
];
const hatchedOf=(p=me())=>(p&&p.hatched)||[];
/* pronto: aún no hay juegos · cerrado: falta el trofeo · lista: se puede abrir · abierto: ya es una sección */
function eggState(e,p=me()){
  if(!e.sid) return 'pronto';
  if(hatchedOf(p).includes(e.sid)) return 'abierto';
  return DB.eggsOpen||hasTrophy(e.need,p,1)?'lista':'cerrado';
}
const secOpen=(sid,p=me())=>{const e=PRONTO.find(x=>x.sid===sid);return !e||eggState(e,p)==='abierto';};
/* para que la estantería de trofeos no enseñe los de una sección que sigue dentro de su huevo */
function withSubjects(list,fn){const all=SUBJECTS.slice();SUBJECTS.splice(0,SUBJECTS.length,...list);try{return fn();}finally{SUBJECTS.splice(0,SUBJECTS.length,...all);}}

/* un toque: el dibujo da un salto (o se tambalea) y, si hay sonido, Mochi dice la frase */
function dinoTap(el,cls,text){
  el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
  sfx.tap(); if(DB.sound&&text) speak(text);
}
function valle(p,t){
  const dinos=VALLE.map(v=>{const d=DK[v.k];
    return h('button',{class:'vdino'+(v.vuela?' vuela':''),style:`--x:${v.x};--hh:${v.hh};${v.t!=null?`top:${v.t}%`:`bottom:${v.b}%`}`,'aria-label':d.n,
      onclick:e=>dinoTap(e.currentTarget,'salta',d.n),onanimationend:e=>e.currentTarget.classList.remove('salta')},
      h('img',{src:`img/v-${v.k}.webp`,alt:'',draggable:'false'}));});
  return h('div',{class:'valle-wrap'},
    h('section',{class:'valle'},
      h('img',{class:'valle-fondo',src:'img/portada-valle.webp',alt:''}),
      ...dinos,
      h('button',{class:'vmochi','aria-label':'Mochi',onclick:e=>dinoTap(e.currentTarget,'salta',SAY.home),onanimationend:e=>e.currentTarget.classList.remove('salta')},mochi('wave'))),
    h('div',{class:'bubble valle-bubble'},h('div',null,h('h1',null,`¡Hola, ${p.name}!`),
      h('p',null,t?`Llevas ${t} ${t===1?'estrella':'estrellas'}. ${APP.homeAsk}`:`${APP.homeAsk} ${APP.homePick}`),
      h('p',{class:'valle-pista'},'Toca un dinosaurio para oír su nombre.')),sayBtn(SAY.home)));
}
function gameStars(g){return hasLevels(g)?[1,2,3].reduce((a,l)=>a+lvStars(g.id,l),0):bestStars(g.id);}
function seccion(s){
  const gs=gamesOf(s.id), n=gs.filter(g=>!g.noStars).length, alb=gs.find(g=>g.noStars);
  return h('article',{class:'dsec'+(hasTrophy(s.id)?' done':''),style:`--c:var(--${s.id})`,'data-sid':s.id},
    h('button',{class:'dsec-head',onclick:()=>{sfx.pop();goSubject(s.id);},'aria-label':`${s.name}: ${n} juegos`},
      h('img',{class:'dsec-img',src:s.img,alt:''}),
      hasTrophy(s.id)?h('span',{class:'subj-cup','aria-label':'Trofeo conseguido'},'🏆'):null,
      h('span',{class:'dsec-name'},s.name),
      h('span',{class:'dsec-count'},`${n} juegos${alb?' y '+alb.title.toLowerCase():''}`),
      subjBar(s.id)),
    h('div',{class:'dsec-games'},gs.map(g=>h('button',{class:'gchip',onclick:()=>{sfx.pop();openGame(g.id);}},
      h('span',{class:'gchip-ic','aria-hidden':'true'},g.icon),h('span',{class:'gchip-t'},g.title),
      h('span',{class:'gchip-st'},g.badge?g.badge():`★ ${gameStars(g)}`)))));
}
/* grietas del huevo: salen más cuantas más estrellas lleva de la sección que lo abre */
const CRACKS='<svg viewBox="0 0 100 120" aria-hidden="true"><path class="ck1" d="M50 10 L44 24 L55 32 L46 44"/><path class="ck2" d="M46 44 L58 54 L47 63 L59 73"/><path class="ck3" d="M12 64 L24 58 L33 67 L45 60 L57 69 L69 60 L79 67 L89 60"/></svg>';
function huevo(e,p){
  const st=eggState(e,p),pic=h('span',{class:'egg-pic'},h('img',{class:'egg-img',src:e.egg,alt:'',draggable:'false'}));
  let tag='Muy pronto',cls='egg';
  if(st!=='pronto'){const sp=subjProg(e.need,p),f=sp.max?sp.got/sp.max:0;
    const ck=st==='lista'?3:f>=.67?2:f>=.34?1:0; cls+=' ck-'+ck+(st==='lista'?' lista':'');
    const cr=h('span',{class:'egg-cracks'});cr.innerHTML=CRACKS;pic.append(cr);
    tag=st==='lista'?'¡Tócalo!':`${sp.got}/${sp.max} ★ de ${SUBJ[e.need].name}`;}
  return h('button',{class:cls,'aria-label':st==='lista'?`${e.name}: tócalo para abrirlo`:`${e.name}: ${st==='pronto'?'muy pronto':tag}`,
    onclick:ev=>{const el=ev.currentTarget; if(st==='lista') return hatch(e,el,p); dinoTap(el,'tiembla',e.say);},
    onanimationend:ev=>ev.currentTarget.classList.remove('tiembla')},
    pic,h('span',{class:'egg-name'},e.name),h('span',{class:'egg-tag'},tag));
}
/* el huevo se abre: la cáscara salta, sale Mochi paleontóloga y la sección aparece en la portada */
function hatch(e,btn,p){
  if(btn.classList.contains('abriendo')) return; btn.classList.add('abriendo'); stopVoice();
  const pic=btn.querySelector('.egg-pic'),src=e.egg;
  pic.replaceChildren(h('img',{class:'egg-img egg-bot',src,alt:''}),h('img',{class:'egg-sale',src:SUBJ[e.sid].img,alt:''}),h('img',{class:'egg-img egg-top',src,alt:''}));
  btn.querySelector('.egg-tag').textContent='¡Ya sale!';
  sfx.pop(); setTimeout(()=>{sfx.win();confetti();burst(pic);},450);
  p.hatched=[...hatchedOf(p),e.sid]; save();
  if(DB.sound) setTimeout(()=>speak(e.hatch),300);
  setTimeout(()=>{
    if(me()!==p||!btn.isConnected) return;
    const secs=$('.dsecs'); if(secs){const c=seccion(SUBJ[e.sid]);c.classList.add('nueva');secs.append(c);c.scrollIntoView({behavior:reduced?'auto':'smooth',block:'center'});}
    btn.remove(); const rest=$('.pronto .eggs'); if(rest&&!rest.children.length) $('.pronto').remove();
  },2300);
}
function pronto(p){
  const eggs=PRONTO.filter(e=>eggState(e,p)!=='abierto');
  if(!eggs.length) return null;
  return h('section',{class:'pronto'},
    h('h2',{class:'pronto-h'},'Huevos de dinosaurio'),
    h('p',{class:'pronto-p'},'Dentro hay juegos nuevos. Tócalos para saber qué traen.'),
    h('div',{class:'eggs'},eggs.map(e=>huevo(e,p))));
}
/* para las familias: abrir los huevos sin esperar al trofeo (para todos los jugadores de este dispositivo) */
function eggSwitch(){
  return h('div',{class:'egg-switch'},h('strong',null,'🥚 Huevos de la portada'),
    h('p',null,DB.eggsOpen?'Los huevos se pueden abrir ya, sin esperar al trofeo, para todos los jugadores de este dispositivo.'
      :'Las secciones nuevas salen de su huevo cuando el niño consigue el trofeo que se indica. Si prefieres no esperar (por ejemplo, para un hermano pequeño), puedes dejar que se abran ya, para todos los jugadores de este dispositivo.'),
    h('button',{class:'btn ghost',onclick:()=>{DB.eggsOpen=!DB.eggsOpen;save();sfx.pop();goHome();const f=$('details.families');if(f){f.open=true;const s=f.querySelector('.egg-switch');s&&s.scrollIntoView({block:'center'});}}},
      DB.eggsOpen?'Volver a esperar al trofeo':'Abrir los huevos ya'));
}
goHome=function(){
  if(!askedPersist){askedPersist=true;try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{});}catch(e){}}
  const p=me(); if(!p) return goProfiles(); RUN=null; CUR_SUB=null; preloadVoices();
  const open=SUBJECTS.filter(s=>secOpen(s.id,p));
  let pend=null; for(const s of open){const l=tLevels(s.id).find(l=>earnTrophy(s.id,l)); if(l){pend=[s.id,l];break;}}
  mount(h('div',{class:'dhome'},valle(p,totalStars(p)),h('div',{class:'dsecs subjects'},open.map(seccion)),pronto(p)),
    withSubjects(open,trophyShelf),installCard(),familiesBox());
  const fam=$('details.families'),ul=fam&&fam.querySelector('ul'); if(ul) ul.after(eggSwitch());
  if(pend){setTimeout(()=>{if(!RUN&&!CUR_SUB&&!RW&&me()===p) showReward(pend[0],true,true,pend[1]);},900);return;}
  const lista=PRONTO.find(e=>eggState(e,p)==='lista');
  if(lista){greeted=true;instr(lista.ready);return;}
  if(!greeted){greeted=true;instr(SAY.home);}
};
</script>
<script>
"use strict";
/* ================= ARRANQUE ================= */
document.addEventListener('pointerup',()=>{try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{});}catch(e){}},{once:true});
if(me()) goHome(); else goProfiles();
if(location.hash==='#diag') diagPanel();
</script>
