/* Layout: mundo de plastilina — cielo de fondo, Mochi (la mascota) guía cada pantalla, fichas gorditas con relieve como juguetes */
:root{
  --sky1:#BDE8FF; --sky2:#F1FAFF; --cloud:rgba(255,255,255,.75);
  --ink:#232A4D; --ink-soft:#5C6589; --card:#FFFFFF; --line:#DDE6F4; --paper:#F7FAFF; --rule:#D8E6F6;
  /* colores de la paleta: cada app los usa para sus secciones (en su app.css) */
  --rojo:#F04F59; --azul:#3570F0; --verde:#1FA862; --morado:#8456F0; --naranja:#F07A12; --rosa:#DE3F96; --turquesa:#0B98AE;
  --sun:#FFC93C; --on-c:#FFFFFF;
  --ok:#1FA65A; --ok-bg:#E3F7EA; --ko:#EC4256; --ko-bg:#FFE9EC; --star:#FFB400; --star-off:#D7E0EE;
  --shadow:rgba(35,42,77,.16);
  --f-display:"Baloo 2","Arial Rounded MT Bold",ui-rounded,system-ui,sans-serif;
  --f-read:"Andika","Trebuchet MS",system-ui,sans-serif;
  --r:28px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --sky1:#101A36; --sky2:#1B2852; --cloud:rgba(255,255,255,.05);
  --ink:#F2F5FF; --ink-soft:#AAB4D8; --card:#1F2B52; --line:#33416E; --paper:#18234A; --rule:#2B3966;
  --ok:#3ED184; --ok-bg:#163C2E; --ko:#FF7385; --ko-bg:#4A2235; --star:#FFC933; --star-off:#3A4775;
  --shadow:rgba(0,0,0,.4); color-scheme:dark }}
:root[data-theme="dark"]{
  --sky1:#101A36; --sky2:#1B2852; --cloud:rgba(255,255,255,.05);
  --ink:#F2F5FF; --ink-soft:#AAB4D8; --card:#1F2B52; --line:#33416E; --paper:#18234A; --rule:#2B3966;
  --ok:#3ED184; --ok-bg:#163C2E; --ko:#FF7385; --ko-bg:#4A2235; --star:#FFC933; --star-off:#3A4775;
  --shadow:rgba(0,0,0,.4); color-scheme:dark }

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0; color:var(--ink); font-family:var(--f-read); font-size:18px; line-height:1.45;
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 70%) fixed; background-color:var(--sky2);
  -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; overflow-x:hidden}
body::before{content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(60px 34px at 12% 14%,var(--cloud) 98%,transparent),radial-gradient(44px 30px at 16% 11%,var(--cloud) 98%,transparent),
    radial-gradient(80px 40px at 84% 22%,var(--cloud) 98%,transparent),radial-gradient(52px 34px at 89% 18%,var(--cloud) 98%,transparent),
    radial-gradient(70px 36px at 60% 8%,var(--cloud) 98%,transparent),
    radial-gradient(900px 260px at 50% 112%,color-mix(in srgb,var(--verde) 22%,transparent) 60%,transparent 61%)}
input{-webkit-user-select:text; user-select:text}
button{font:inherit; color:inherit; cursor:pointer; touch-action:manipulation}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:4px solid var(--azul); outline-offset:3px}
img{display:block; max-width:100%}
#app{max-width:1040px; margin:0 auto; padding-inline:16px; padding-block:10px 160px}
h1,h2,h3{font-family:var(--f-display); line-height:1.08; margin:0; text-wrap:balance; font-weight:800}

/* barra superior */
.topbar{display:flex; align-items:center; gap:10px; padding-block:4px 10px}
.brand{display:flex; align-items:center; gap:8px; margin-right:auto; background:none; border:0; padding:0; font-family:var(--f-display); font-weight:800; font-size:1.5rem}
.brand img{width:48px; height:48px; object-fit:contain; filter:drop-shadow(0 3px 2px var(--shadow))}
.pill{display:flex; align-items:center; gap:8px; min-height:52px; background:var(--card); border:0; border-radius:999px; padding:4px 16px 4px 4px; font-weight:700; box-shadow:0 4px 0 var(--line),0 8px 18px var(--shadow)}
.pill .av{font-size:1.5rem; width:44px; height:44px; display:grid; place-items:center; border-radius:50%; background:color-mix(in srgb,var(--sun) 40%,var(--card))}
.coin{display:inline-flex; align-items:center; gap:4px; font-family:var(--f-display); font-weight:800; font-size:1.15rem; font-variant-numeric:tabular-nums}
.coin::before{content:"★"; display:grid; place-items:center; width:28px; height:28px; border-radius:50%; background:var(--star); color:#fff; font-size:1rem; box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.round{width:52px; height:52px; flex:none; border-radius:50%; border:0; background:var(--card); font-size:1.4rem; display:grid; place-items:center; box-shadow:0 4px 0 var(--line),0 8px 18px var(--shadow)}
.round:active,.pill:active{transform:translateY(3px); box-shadow:0 1px 0 var(--line)}

/* botones de juguete */
.btn{--c:var(--azul); display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:64px; padding:10px 30px; border:0; border-radius:22px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 78%,#fff),var(--c)); color:var(--on-c); font-family:var(--f-display); font-weight:800; font-size:1.4rem;
  text-shadow:0 2px 0 rgba(0,0,0,.15); box-shadow:inset 0 -6px 0 color-mix(in srgb,var(--c) 70%,#000),inset 0 3px 0 rgba(255,255,255,.35),0 8px 18px color-mix(in srgb,var(--c) 35%,transparent); transition:transform .08s}
.btn:active{transform:translateY(3px) scale(.98)}
.btn.ghost{background:var(--card); color:var(--ink); text-shadow:none; box-shadow:inset 0 -5px 0 var(--line),0 6px 14px var(--shadow)}
.btn.big{min-height:76px; font-size:1.65rem; padding-inline:40px}
.btn[disabled]{opacity:.45; pointer-events:none}
.row{display:flex; flex-wrap:wrap; gap:14px; align-items:center}
.center{justify-content:center; text-align:center}

/* Mochi y bocadillos */
.mochi{object-fit:contain; filter:drop-shadow(0 10px 10px var(--shadow)); animation:float 3.2s ease-in-out infinite}
.bubble{position:relative; background:var(--card); border-radius:26px; padding:16px 22px; box-shadow:0 6px 0 var(--line),0 12px 26px var(--shadow); min-width:0}
.bubble::before{content:""; position:absolute; left:-14px; top:38px; border:14px solid transparent; border-right-color:var(--card); border-left:0}
.bubble h1{font-size:clamp(1.9rem,4.6vw,2.7rem)}
.bubble p{margin:4px 0 0; color:var(--ink-soft); font-size:1.15rem}
.say{width:52px; height:52px; flex:none; border-radius:50%; border:0; background:color-mix(in srgb,var(--c,var(--azul)) 14%,var(--card)); color:var(--c,var(--azul)); font-size:1.4rem; display:grid; place-items:center; box-shadow:inset 0 -4px 0 color-mix(in srgb,var(--c,var(--azul)) 25%,var(--line))}
.say:active{transform:scale(.94)}
.say.on{animation:pulse 1s infinite}

/* inicio */
.hero{display:grid; grid-template-columns:auto 1fr; align-items:center; gap:10px 18px; margin-block:4px 22px}
.hero .mochi{width:clamp(130px,22vw,190px)}
.hero .bubble{display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px}
.hero .bubble > div{flex:1; min-width:200px}
.subjects{display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:26px 20px; padding-top:14px}
.subj{--c:var(--azul); position:relative; text-align:left; border:0; border-radius:var(--r); padding:22px 22px 20px; min-height:190px; color:var(--on-c);
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 72%,#fff) 0%,var(--c) 62%);
  box-shadow:inset 0 -9px 0 color-mix(in srgb,var(--c) 68%,#000),inset 0 4px 0 rgba(255,255,255,.35),0 14px 26px color-mix(in srgb,var(--c) 35%,transparent);
  display:flex; flex-direction:column; gap:6px; transition:transform .12s}
.subj:active{transform:scale(.97) translateY(3px)}
.subj-img{position:absolute; right:-8px; top:-30px; width:150px; height:150px; object-fit:contain; filter:drop-shadow(0 8px 6px rgba(0,0,0,.18)); transition:transform .25s}
.subj:hover .subj-img{transform:rotate(-6deg) scale(1.05)}
.subj-name{font-family:var(--f-display); font-weight:800; font-size:2.1rem; line-height:1; text-shadow:0 3px 0 rgba(0,0,0,.14); padding-right:120px}
.subj-blurb{font-size:1rem; line-height:1.3; padding-right:110px; opacity:.96; flex:1}
.subj-prog{display:flex; align-items:center; gap:10px; font-family:var(--f-display); font-weight:800; font-size:1.05rem}
.bar{flex:1; height:14px; border-radius:8px; background:rgba(0,0,0,.18); overflow:hidden; box-shadow:inset 0 2px 0 rgba(0,0,0,.12)}
.bar i{display:block; height:100%; min-width:14px; background:linear-gradient(180deg,#FFE27A,var(--star)); border-radius:8px; transition:width 1.2s cubic-bezier(.3,1.1,.5,1) .15s}
.subj-prog b{font-weight:800; font-variant-numeric:tabular-nums}
.subj-prog .st{color:#FFE27A; text-shadow:0 2px 0 rgba(0,0,0,.2); font-size:1.25rem; margin-left:-6px}
.subj-prog.grow b,.subj-prog.grow .st{display:inline-block; animation:bounce .6s .9s}
.subj-prog.full .bar i{background:linear-gradient(90deg,#FFE27A,#FFF6C9,#FFB400,#FFE27A); background-size:300% 100%; animation:gold 3s linear infinite}
@keyframes gold{to{background-position:-300% 0}}
.subj-cup{position:absolute; left:-12px; top:-22px; font-size:2.6rem; line-height:1; filter:drop-shadow(0 4px 4px rgba(0,0,0,.25)); animation:float 3s ease-in-out infinite}
.coin.pop{animation:bounce .6s} .coin.pop::before{animation:starpop2 .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes starpop2{50%{transform:scale(1.5) rotate(25deg)}}
.shelf{margin-top:34px}
.shelf-head{display:flex; align-items:center; gap:12px; margin-bottom:12px}
.shelf-head h2{font-size:1.7rem}
.shelf-row{display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:12px; padding:16px 16px 22px; border-radius:var(--r);
  background:linear-gradient(180deg,color-mix(in srgb,#D9A066 32%,var(--card)),color-mix(in srgb,#C68A50 48%,var(--card)));
  box-shadow:inset 0 -12px 0 color-mix(in srgb,#8F5D2E 60%,var(--card)),0 10px 22px var(--shadow)}
.trophy{position:relative; display:flex; flex-direction:column; align-items:center; gap:4px; min-width:0; border:0; border-radius:20px; padding:12px 6px 10px; background:var(--card); box-shadow:inset 0 -5px 0 var(--line),0 4px 10px var(--shadow)}
.trophy:active{transform:translateY(3px) scale(.98)}
.trophy .cup{font-size:2.6rem; line-height:1; filter:grayscale(1) opacity(.3)}
.trophy img{position:absolute; right:2px; top:2px; width:44px; height:44px; object-fit:contain; filter:grayscale(1) opacity(.45)}
.trophy .t-name{font-family:var(--f-display); font-weight:800; font-size:.98rem; line-height:1.05; text-align:center; overflow-wrap:anywhere}
.trophy .t-sub{font-size:.85rem; font-weight:700; color:var(--ink-soft); font-variant-numeric:tabular-nums}
.trophy.own{background:linear-gradient(180deg,color-mix(in srgb,var(--star) 22%,var(--card)),var(--card)); box-shadow:inset 0 -5px 0 color-mix(in srgb,var(--star) 55%,var(--line)),0 0 0 3px var(--star),0 6px 14px var(--shadow)}
.trophy.own .cup{filter:drop-shadow(0 4px 3px rgba(0,0,0,.2)); animation:float 3s ease-in-out infinite}
.trophy.own img{filter:none}
.trophy.own .t-sub{color:var(--c)}
@media (max-width:860px){ .shelf-row{grid-template-columns:repeat(3,minmax(0,1fr))} }
.families{margin-top:30px; background:var(--card); border-radius:var(--r); padding:4px 22px; box-shadow:0 5px 0 var(--line),0 10px 22px var(--shadow)}
.families summary{font-family:var(--f-display); font-weight:800; font-size:1.25rem; padding-block:14px; cursor:pointer}
.families ul{margin:0 0 14px; padding-left:20px; max-width:72ch}
.families li{margin-bottom:6px}
.families p{max-width:72ch; color:var(--ink-soft)}

/* asignatura */
.banner{--c:var(--azul); position:relative; display:flex; align-items:center; gap:16px; min-height:150px; padding:20px 170px 20px 20px; margin:6px 0 24px; border-radius:var(--r); color:var(--on-c);
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 72%,#fff),var(--c) 65%); box-shadow:inset 0 -9px 0 color-mix(in srgb,var(--c) 68%,#000),0 14px 26px color-mix(in srgb,var(--c) 30%,transparent)}
.banner h1{font-size:clamp(2.2rem,6vw,3.2rem); text-shadow:0 3px 0 rgba(0,0,0,.15)}
.banner p{margin:2px 0 0; font-size:1.1rem; opacity:.95}
.banner img{position:absolute; right:6px; bottom:-6px; width:180px; height:180px; object-fit:contain; filter:drop-shadow(0 8px 8px rgba(0,0,0,.2))}
.banner .round{background:rgba(255,255,255,.92); color:#232A4D; box-shadow:0 4px 0 rgba(0,0,0,.15)}
.banner-txt{flex:1; min-width:0}
.banner-prog{display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; margin-top:10px; max-width:480px}
.banner-prog .subj-prog{flex:1; min-width:200px}
.cupbtn{min-height:46px; border:0; border-radius:999px; padding:4px 16px; background:#fff; color:#232A4D; font-family:var(--f-display); font-weight:800; font-size:1.05rem; box-shadow:0 4px 0 rgba(0,0,0,.18),0 0 0 3px var(--star)}
.cupbtn:active{transform:translateY(3px)}
.acts{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px}
.act{display:grid; grid-template-columns:76px 1fr; gap:4px 16px; align-items:center; text-align:left; background:var(--card); border:0; border-radius:24px; padding:16px 18px;
  box-shadow:inset 0 -6px 0 var(--line),0 10px 22px var(--shadow); transition:transform .1s}
.act:active{transform:translateY(3px) scale(.99)}
.act-icon{grid-row:1/4; width:76px; height:76px; border-radius:24px; display:grid; place-items:center; font-size:2.4rem;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 30%,var(--card)),color-mix(in srgb,var(--c) 55%,var(--card))); box-shadow:inset 0 -5px 0 color-mix(in srgb,var(--c) 45%,var(--line))}
.act h3{font-size:1.4rem}
.act p{margin:0; color:var(--ink-soft); font-size:.95rem; line-height:1.3}
.stars{display:inline-flex; gap:3px; font-size:1.3rem; line-height:1}
.stars .on{color:var(--star); text-shadow:0 2px 0 color-mix(in srgb,var(--star) 60%,#000)} .stars .off{color:var(--star-off)}

/* juego */
.game{--c:var(--azul)}
.game-head{display:flex; align-items:center; gap:14px; margin-bottom:16px}
.game-title{flex:1; min-width:0}
.game-title h2{font-size:1.55rem; color:var(--c)}
.meter{display:flex; align-items:center; gap:12px; margin-top:8px; max-width:560px}
.m-count{flex:none; min-width:2.6em; font-family:var(--f-display); font-weight:800; font-size:1.05rem; color:var(--ink-soft); font-variant-numeric:tabular-nums}
.m-track{position:relative; flex:1; height:18px; margin:0 18px 0 4px; border-radius:10px; background:var(--card); box-shadow:inset 0 3px 0 var(--line),0 2px 6px var(--shadow)}
.m-fill{position:absolute; left:0; top:0; bottom:0; width:0; border-radius:10px; background:linear-gradient(180deg,#FFE27A,var(--star)); box-shadow:inset 0 -3px 0 rgba(0,0,0,.12); transition:width .7s cubic-bezier(.3,1.25,.5,1); overflow:hidden}
.m-fill::after{content:""; position:absolute; inset:0; background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.7) 50%,transparent 70%); transform:translateX(-100%)}
.m-fill.up::after{animation:shine .9s ease-out}
.m-star{position:absolute; top:50%; width:36px; height:36px; transform:translate(-50%,-50%); display:grid; place-items:center; border-radius:50%; background:var(--card); color:var(--star-off); font-size:1.4rem; line-height:1;
  box-shadow:0 3px 0 var(--line),0 4px 10px var(--shadow)}
.m-star.on{background:radial-gradient(circle at 35% 30%,#FFE9A0,var(--star) 70%); color:#fff; text-shadow:0 2px 0 rgba(0,0,0,.18); box-shadow:0 0 0 4px color-mix(in srgb,var(--star) 35%,transparent),0 4px 10px var(--shadow); animation:starpop .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes starpop{0%{transform:translate(-50%,-50%) scale(.5)}55%{transform:translate(-50%,-50%) scale(1.45) rotate(18deg)}100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes shine{to{transform:translateX(100%)}}
.stage{position:relative; background:var(--card); border-radius:34px; padding:clamp(18px,3.4vw,36px); min-height:380px; display:flex; flex-direction:column; align-items:center; gap:22px;
  box-shadow:inset 0 -8px 0 color-mix(in srgb,var(--c) 22%,var(--line)),0 18px 40px var(--shadow)}
.stage::before{content:""; position:absolute; inset:0 0 auto; height:10px; border-radius:34px 34px 0 0; background:var(--c); opacity:.9}
.q-prompt{font-family:var(--f-display); font-weight:800; font-size:clamp(1.45rem,3.4vw,2rem); text-align:center; line-height:1.15; max-width:30ch}
.q-note{color:var(--ink-soft); text-align:center; margin:-12px 0 0; max-width:52ch}
.q-emoji{font-size:clamp(5rem,13vw,7rem); line-height:1; filter:drop-shadow(0 8px 6px var(--shadow)); animation:popin .45s cubic-bezier(.3,1.6,.5,1) both}
.q-big{font-family:var(--f-display); font-weight:800; font-size:clamp(3rem,10vw,4.6rem); line-height:1; font-variant-numeric:tabular-nums; color:var(--ink)}
.with-say{display:flex; align-items:center; gap:14px; justify-content:center; flex-wrap:wrap}
.tag{display:inline-block; font-family:var(--f-display); font-weight:800; font-size:1rem; padding:4px 14px; border-radius:999px; background:color-mix(in srgb,var(--c) 16%,var(--card)); color:var(--ink)}
.tag.think{background:color-mix(in srgb,var(--star) 30%,var(--card))}

.opts{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:16px; width:100%; max-width:660px}
.opts.wide{grid-template-columns:1fr; max-width:580px}
.opt{position:relative; min-height:82px; border-radius:22px; border:3px solid color-mix(in srgb,var(--c) 30%,var(--line)); background:var(--card); font-family:var(--f-read); font-weight:700;
  font-size:clamp(1.5rem,3.8vw,2.1rem); padding:8px 14px; box-shadow:inset 0 -6px 0 color-mix(in srgb,var(--c) 18%,var(--line)); transition:transform .08s}
.opts.wide .opt{font-size:1.3rem; text-align:left; padding:14px 20px}
.opt:active{transform:translateY(3px) scale(.98)}
.opt.ok{background:var(--ok-bg); border-color:var(--ok); box-shadow:inset 0 -6px 0 color-mix(in srgb,var(--ok) 50%,var(--card)); animation:bounce .5s}
.opt.ko{background:var(--ko-bg); border-color:var(--ko); box-shadow:none; opacity:.55; pointer-events:none; text-decoration:line-through; animation:shake .35s}
.opt.lock{pointer-events:none}
.burst{position:absolute; left:50%; top:50%; pointer-events:none; color:var(--star); font-size:22px; animation:burst .7s ease-out forwards}

.word{display:flex; align-items:flex-end; flex-wrap:wrap; justify-content:center; font-size:clamp(2.8rem,8vw,4.2rem); font-weight:700; letter-spacing:.04em; line-height:1.1}
.gap{display:inline-block; min-width:1.2em; padding:0 .12em; margin:0 .06em; border-bottom:6px dashed var(--c); color:var(--c); text-align:center}
.gap.fill{border-bottom-style:solid; border-color:var(--ok); color:var(--ok); animation:bounce .5s}
.gap.empty::before{content:"?"; opacity:.35}

.ans{min-width:3.4em; padding:4px 18px; border-radius:20px; border:4px dashed var(--c); background:var(--paper); font-size:clamp(2.6rem,7vw,3.5rem); font-weight:700; text-align:center; font-variant-numeric:tabular-nums; line-height:1.2}
.ans.empty{color:var(--ink-soft); opacity:.55}
.ans.good{border-style:solid; border-color:var(--ok); color:var(--ok); background:var(--ok-bg); animation:bounce .5s}
.ans.bad{border-color:var(--ko); color:var(--ko); animation:shake .35s}
.keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:100%; max-width:350px}
.key{min-height:66px; border-radius:20px; border:0; background:var(--paper); font-family:var(--f-display); font-size:2rem; font-weight:800; font-variant-numeric:tabular-nums;
  box-shadow:inset 0 -6px 0 var(--line),0 4px 10px var(--shadow)}
.key:active{transform:translateY(3px); box-shadow:inset 0 -2px 0 var(--line)}
.key.ok{background:linear-gradient(180deg,color-mix(in srgb,var(--ok) 75%,#fff),var(--ok)); color:#fff; box-shadow:inset 0 -6px 0 color-mix(in srgb,var(--ok) 65%,#000)}
.key.del{font-size:1.5rem}
.split{display:flex; flex-wrap:wrap; gap:24px 40px; align-items:center; justify-content:center; width:100%}

.colop{display:grid; gap:6px; font-variant-numeric:tabular-nums; justify-content:center}
.cell{width:clamp(54px,11vw,70px); height:clamp(58px,11vw,74px); display:grid; place-items:center; font-size:clamp(2.1rem,6vw,2.9rem); font-weight:700; border-radius:14px}
.cell.in{border:4px dashed var(--c); background:var(--paper)}
.cell.carry{height:42px; font-size:1.4rem; border:3px dashed color-mix(in srgb,var(--c) 40%,var(--line)); color:var(--ink-soft); background:transparent}
.cell.sel{border-style:solid; box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 25%,transparent)}
.cell.bad{border-color:var(--ko); color:var(--ko); background:var(--ko-bg)}
.cell.good{border-color:var(--ok); color:var(--ok); background:var(--ok-bg)}
.cell.sign{color:var(--c)}
.opline{grid-column:1/-1; height:6px; border-radius:3px; background:var(--ink)}
.carry-lbl{grid-column:1/-1; font-size:.85rem; color:var(--ink-soft); text-align:right; margin-bottom:-4px}

.blocks{display:flex; flex-wrap:wrap; gap:18px; align-items:flex-end; justify-content:center; max-width:740px}
.bgroup{display:flex; flex-wrap:wrap; gap:6px; align-items:flex-end; max-width:340px}
.blk-c{width:92px; height:92px; background-color:var(--azul); border-radius:6px; box-shadow:inset 0 -4px 0 rgba(0,0,0,.2);
  background-image:linear-gradient(rgba(255,255,255,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.35) 1px,transparent 1px); background-size:9.2px 9.2px}
.blk-d{width:12px; height:92px; background-color:var(--verde); border-radius:5px; box-shadow:inset -2px -3px 0 rgba(0,0,0,.2); background-image:linear-gradient(rgba(255,255,255,.35) 1px,transparent 1px); background-size:100% 9.2px}
.blk-u{width:14px; height:14px; background:var(--naranja); border-radius:4px; box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.blk-legend{display:flex; flex-wrap:wrap; gap:6px 18px; justify-content:center; color:var(--ink-soft); font-size:.95rem}

.groups{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; max-width:720px}
.grp{min-width:56px; min-height:56px; padding:6px 8px; border-radius:18px; display:flex; flex-wrap:wrap; gap:2px; align-items:center; justify-content:center; font-size:1.35rem; max-width:112px;
  background:color-mix(in srgb,var(--c) 10%,var(--card)); border:3px solid color-mix(in srgb,var(--c) 45%,var(--line))}
.grp.empty{border-style:dashed}

.numline{width:100%; max-width:660px; height:auto; overflow:visible}
.numline .axis{stroke:var(--ink); stroke-width:5; stroke-linecap:round}
.numline .tick{stroke:var(--ink-soft); stroke-width:2.5}
.numline .tick.mid{stroke:var(--ink); stroke-width:3.5}
.numline text{fill:var(--ink); font-family:var(--f-read); font-weight:700; font-size:22px}
.numline .mark{fill:var(--c)} .numline .mark-t{fill:var(--c); font-size:28px; font-family:var(--f-display); font-weight:800}

.tiles{display:flex; flex-wrap:wrap; gap:12px; justify-content:center; max-width:660px}
.tile{min-width:78px; min-height:78px; padding:6px 18px; border-radius:20px; border:0; color:var(--on-c); font-size:2.1rem; font-weight:700; text-shadow:0 2px 0 rgba(0,0,0,.15);
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 75%,#fff),var(--c)); box-shadow:inset 0 -6px 0 color-mix(in srgb,var(--c) 68%,#000),0 6px 12px color-mix(in srgb,var(--c) 30%,transparent)}
.tile:active{transform:translateY(3px) scale(.97)}
.tile.used{visibility:hidden}
.slots{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; min-height:80px}
.slot{min-width:62px; height:76px; padding:0 10px; border-bottom:6px solid var(--line); display:grid; place-items:center; font-size:2.5rem; font-weight:700}
.slot.on{border-color:var(--c); animation:popin .3s both}
.slots.good .slot{border-color:var(--ok); color:var(--ok)}

.sentence{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; max-width:740px}
.wchip{min-height:66px; padding:6px 16px; border-radius:18px; border:3px solid var(--line); background:var(--paper); font-size:clamp(1.55rem,4vw,2.05rem); font-weight:700; box-shadow:inset 0 -5px 0 var(--line)}
.wchip.cap{border-color:var(--c); background:color-mix(in srgb,var(--c) 14%,var(--card)); animation:bounce .35s}
.wchip.err{border-color:var(--ko); background:var(--ko-bg); animation:shake .35s}
.wchip.good{border-color:var(--ok); background:var(--ok-bg)}
.wchip.punct{border:0; background:none; box-shadow:none; padding-inline:0; pointer-events:none}

.readtext{width:100%; max-width:68ch; background:var(--paper); border-radius:22px; padding:18px 24px 18px 34px; font-size:clamp(1.2rem,2.6vw,1.38rem); line-height:2; position:relative;
  background-image:linear-gradient(transparent calc(2em - 2px),var(--rule) calc(2em - 2px),var(--rule) 2em); background-size:100% 2em; background-position:0 18px;
  box-shadow:inset 0 -5px 0 var(--line); border-left:6px solid color-mix(in srgb,var(--rojo) 55%,transparent)}
.readtext h3{font-size:1.6rem; line-height:2em; color:var(--c)}
.readtext p{margin:0}
.qlist{width:100%; max-width:62ch; margin:0; padding-left:0; list-style:none; display:grid; gap:10px}
.qlist li{display:flex; align-items:center; gap:12px; background:var(--paper); border-radius:18px; padding:10px 14px; font-size:1.2rem; font-weight:700; box-shadow:inset 0 -4px 0 var(--line)}
.listen{width:160px; height:160px; border-radius:50%; border:0; color:#fff; font-size:3.8rem; display:grid; place-items:center; padding:0; background:linear-gradient(180deg,color-mix(in srgb,var(--c) 75%,#fff),var(--c));
  box-shadow:inset 0 -9px 0 color-mix(in srgb,var(--c) 68%,#000),0 14px 26px color-mix(in srgb,var(--c) 35%,transparent)}
.listen.playing{animation:pulse 1.1s infinite}

.memory{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; width:100%; max-width:min(560px,calc((100vh - 270px) * 1.33))}
.card{aspect-ratio:1/1; max-width:100%; border:0; padding:0; background:none; perspective:700px}
.card-in{display:block; position:relative; width:100%; height:100%; transition:transform .4s cubic-bezier(.3,1.4,.5,1); transform-style:preserve-3d}
.card.up .card-in,.card.done .card-in{transform:rotateY(180deg)}
.face,.backf{position:absolute; inset:0; border-radius:20px; display:grid; place-items:center; backface-visibility:hidden; -webkit-backface-visibility:hidden}
.backf{background:linear-gradient(160deg,color-mix(in srgb,var(--c) 72%,#fff),var(--c)); color:#fff; font-family:var(--f-display); font-size:2.4rem; font-weight:800;
  box-shadow:inset 0 -6px 0 color-mix(in srgb,var(--c) 68%,#000)}
.backf img{width:62%; opacity:.95}
.face{transform:rotateY(180deg); background:var(--card); border:4px solid var(--c); font-size:clamp(1.35rem,4vw,2rem); font-weight:700}
.face.emo{font-size:clamp(2.6rem,7vw,3.6rem)}
.card.done .face{border-color:var(--ok); background:var(--ok-bg); animation:bounce .5s}

.timer{position:relative; width:min(300px,70vw); aspect-ratio:1/1}
.timer svg{width:100%; height:100%; transform:rotate(-90deg)}
.timer .trk{stroke:var(--star-off); fill:none; stroke-width:20}
.timer .val{stroke:var(--c); fill:none; stroke-width:20; stroke-linecap:round; transition:stroke-dashoffset .3s linear}
.timer .time{position:absolute; inset:0; display:grid; place-items:center; font-family:var(--f-display); font-weight:800; font-size:clamp(3rem,10vw,4.3rem); font-variant-numeric:tabular-nums}
.read-wrap{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:10px 30px}
.read-wrap .mochi{width:clamp(130px,22vw,190px)}
.week{display:flex; gap:8px; flex-wrap:wrap; justify-content:center}
.day{width:54px; height:64px; border-radius:16px; display:grid; place-items:center; font-weight:700; background:var(--paper); line-height:1; box-shadow:inset 0 -4px 0 var(--line)}
.day small{font-size:.8rem; color:var(--ink-soft)}
.day.done{background:var(--ok-bg); color:var(--ok); box-shadow:inset 0 -4px 0 color-mix(in srgb,var(--ok) 40%,var(--card))}
.day.today{outline:3px solid var(--c); outline-offset:2px}
.askcard{width:100%; max-width:62ch; background:var(--paper); border-radius:22px; padding:16px 22px; box-shadow:inset 0 -5px 0 var(--line)}
.askcard h3{font-size:1.3rem; margin-bottom:6px}
.askcard ul{margin:0; padding-left:22px}

/* preparar, final, perfiles */
.setup,.end{display:flex; flex-direction:column; align-items:center; gap:18px; text-align:center; padding-block:8px}
.setup-icon{width:120px; height:120px; border-radius:36px; display:grid; place-items:center; font-size:4.2rem;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 30%,var(--card)),color-mix(in srgb,var(--c) 60%,var(--card))); box-shadow:inset 0 -7px 0 color-mix(in srgb,var(--c) 50%,var(--line)); animation:popin .5s cubic-bezier(.3,1.6,.5,1) both}
.setup h2{font-size:clamp(2rem,5vw,2.6rem)}
.setup p{margin:0; max-width:48ch; color:var(--ink-soft); font-size:1.15rem}
.chips{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; max-width:660px}
.chip{min-height:56px; padding:6px 22px; border-radius:999px; border:0; background:var(--paper); font-weight:700; font-size:1.15rem; box-shadow:inset 0 -4px 0 var(--line)}
.chip.on{background:var(--c); color:#fff; box-shadow:inset 0 -4px 0 color-mix(in srgb,var(--c) 65%,#000)}
.end .mochi{width:clamp(170px,30vw,230px)}
.end h2{font-size:clamp(2.2rem,6vw,3rem)}
.end-stars{display:flex; gap:10px; font-size:clamp(4.2rem,14vw,5.6rem); line-height:1; margin-bottom:-10px}
.end-stars span{color:var(--star-off)}
.end-stars span.on{color:var(--star); text-shadow:0 5px 0 color-mix(in srgb,var(--star) 55%,#000); animation:popin .6s cubic-bezier(.3,1.6,.5,1) backwards}
.end-stars span:nth-child(2){animation-delay:.25s; transform:translateY(-14px)} .end-stars span:nth-child(3){animation-delay:.5s}
.end p{margin:0; font-size:1.2rem; color:var(--ink-soft)}
.stars.big{font-size:clamp(2.6rem,7vw,3.4rem); gap:6px}
.form{max-width:700px; margin:6px auto; display:flex; flex-direction:column; gap:18px}
.form .hero{margin:0}
.form .panel{background:var(--card); border-radius:var(--r); padding:24px; display:flex; flex-direction:column; gap:14px; box-shadow:inset 0 -7px 0 var(--line),0 14px 30px var(--shadow)}
.form label{font-family:var(--f-display); font-weight:800; font-size:1.3rem}
.form input{width:100%; min-height:68px; border-radius:20px; border:3px solid var(--line); background:var(--paper); color:var(--ink); font:inherit; font-size:1.7rem; padding:6px 18px}
.avatars{display:grid; grid-template-columns:repeat(auto-fill,minmax(74px,1fr)); gap:10px}
.avb{aspect-ratio:1/1; border-radius:22px; border:0; background:var(--paper); font-size:2.3rem; box-shadow:inset 0 -5px 0 var(--line)}
.avb.on{background:color-mix(in srgb,var(--sun) 55%,var(--card)); box-shadow:inset 0 -5px 0 color-mix(in srgb,var(--sun) 60%,#000),0 0 0 4px var(--sun); animation:bounce .4s}
.profiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:16px}
.prof{display:flex; flex-direction:column; align-items:center; gap:6px; padding:20px 10px; border-radius:var(--r); border:0; background:var(--card); font-weight:700; font-size:1.25rem; box-shadow:inset 0 -6px 0 var(--line),0 10px 22px var(--shadow)}
.prof-wrap{position:relative; display:grid}
.btn.danger{--c:#D9433A}
.btn.danger-t{color:#D9433A}
.del-row{margin-top:18px; padding-top:14px; border-top:2px dashed var(--line)}
.ficha.confirm{max-width:440px; text-align:center}
.ficha.confirm h2{color:#D9433A; font-size:1.7rem; line-height:1.15}
.ficha.confirm p{font-size:1.1rem; margin:6px 0 16px}
.prof-edit{position:absolute; top:8px; right:8px; width:46px; height:46px; display:grid; place-items:center; border:0; border-radius:50%; padding:0; font-size:1.25rem; line-height:1;
  background:var(--paper); box-shadow:inset 0 -4px 0 var(--line),0 3px 8px var(--shadow)}
.prof-edit:active{transform:scale(.92)}
.prof .av{font-size:3rem; width:86px; height:86px; display:grid; place-items:center; border-radius:50%; background:color-mix(in srgb,var(--sun) 40%,var(--card))}

/* hoja de corrección con Mochi */
.fb{position:fixed; left:0; right:0; bottom:0; z-index:20; padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px)); transform:translateY(120%); transition:transform .28s cubic-bezier(.3,1.3,.5,1)}
.fb.show{transform:none}
.fb-in{max-width:1000px; margin:0 auto; display:flex; align-items:center; gap:14px; flex-wrap:wrap; border-radius:28px; padding:12px 18px 12px 12px; background:var(--card); border:4px solid; box-shadow:0 -6px 30px var(--shadow)}
.fb.ok .fb-in{border-color:var(--ok); background:linear-gradient(180deg,var(--ok-bg),var(--card))}
.fb.ko .fb-in{border-color:var(--ko); background:linear-gradient(180deg,var(--ko-bg),var(--card))}
.fb-img{width:84px; height:84px; object-fit:contain; flex:none; margin-top:-34px; filter:drop-shadow(0 6px 6px var(--shadow))}
.fb.ok .fb-img{animation:bounce .6s}
.fb.ko .fb-img{animation:wiggle .6s}
.fb-text{flex:1; min-width:180px}
.fb-text strong{display:block; font-family:var(--f-display); font-size:1.7rem; line-height:1.1}
.fb.ok strong{color:var(--ok)} .fb.ko strong{color:var(--ko)}
.fb-text span{font-size:1.15rem}
.fb .btn{--c:var(--ok)}

#confetti{position:fixed; inset:0; pointer-events:none; z-index:60}
/* trofeo con vídeo */
.reward{position:fixed; inset:0; z-index:50; display:grid; place-items:center; padding:16px; background:radial-gradient(circle at 50% 38%,rgba(255,210,80,.38),rgba(16,22,46,.82) 72%); animation:fadein .25s both}
.reward.out{animation:fadein .25s reverse both}
.rw-card{--c:var(--azul); width:min(860px,100%); max-height:calc(100vh - 32px); max-height:calc(100dvh - 32px); overflow:auto; background:var(--card); border-radius:34px; padding:18px 22px 22px;
  display:flex; flex-direction:column; align-items:center; gap:16px; box-shadow:inset 0 -9px 0 color-mix(in srgb,var(--c) 35%,var(--line)),0 30px 80px rgba(0,0,0,.45); animation:popin .55s cubic-bezier(.3,1.45,.5,1) both}
.rw-head{display:flex; align-items:center; gap:14px; align-self:stretch}
.rw-cup{font-size:clamp(3.2rem,8vw,4.4rem); line-height:1; filter:drop-shadow(0 6px 6px var(--shadow)); animation:wiggle 1s .5s 2}
.rw-head h2{font-size:clamp(1.8rem,4.6vw,2.7rem); color:var(--c)}
.rw-head p{margin:2px 0 0; color:var(--ink-soft); font-size:1.12rem}

.bring{display:flex; flex-direction:column; gap:6px; padding:20px 22px; border-radius:var(--r); background:var(--card); box-shadow:inset 0 -6px 0 var(--line),0 10px 22px var(--shadow)}
.bring.small{margin-top:22px; max-width:700px}
.bring-man{display:flex; flex-direction:column; gap:10px; align-items:flex-start}

/* ---- Lengua: tildes y truco LUNES ---- */
.tword{display:flex; flex-wrap:wrap; justify-content:center; gap:10px}
.tsyl{display:inline-flex; align-items:flex-end; gap:1px; padding:6px 10px; border-radius:18px; background:var(--paper); box-shadow:inset 0 -4px 0 var(--line)}
.tl{font-family:var(--f-read); font-size:clamp(2.5rem,6.6vw,3.5rem); font-weight:700; line-height:1.2; min-width:.55em; text-align:center; color:var(--ink)}
.tv{border:0; border-radius:12px; padding:0 .1em; background:color-mix(in srgb,var(--c) 12%,var(--card)); border-bottom:4px dashed color-mix(in srgb,var(--c) 55%,var(--line))}
.tv:active{transform:translateY(2px)}
.tv.ok{background:var(--ok-bg); color:var(--ok); border-bottom:4px solid var(--ok); animation:bounce .5s}
.tv.ko{background:var(--ko-bg); color:var(--ko); border-bottom-color:var(--ko); animation:shake .35s}
.tword.good .tv:not(.ok){pointer-events:none; opacity:.6}
.q-note.tip{font-weight:700}
.opts.spellings{grid-template-columns:1fr; max-width:420px}
.opts.spellings .opt{font-size:clamp(1.9rem,4.6vw,2.4rem); letter-spacing:.03em}
.lunes{display:flex; flex-direction:column; align-items:center; gap:8px; max-width:440px; padding:12px 18px; border-radius:22px; background:color-mix(in srgb,var(--sun) 22%,var(--card));
  box-shadow:inset 0 -5px 0 color-mix(in srgb,var(--sun) 45%,var(--line)); animation:popin .5s cubic-bezier(.3,1.6,.5,1) both}
.lunes-w{display:flex; gap:6px}
.lunes-w span{width:46px; height:52px; display:grid; place-items:center; border-radius:12px; background:var(--card); color:var(--ink-soft); font-family:var(--f-display); font-weight:800; font-size:1.8rem; box-shadow:inset 0 -4px 0 var(--line)}
.lunes-w .hot{background:var(--c); color:#fff; box-shadow:inset 0 -4px 0 color-mix(in srgb,var(--c) 65%,#000)}
.lunes p{margin:0; text-align:center; font-size:1.05rem}
/* ---- Inglés ---- */
.opts.emos{grid-template-columns:repeat(2,minmax(0,1fr)); max-width:440px}
.opts.emos .opt{min-height:118px}
.emo{font-size:clamp(3.3rem,8vw,4.4rem); line-height:1}
.opts.nums{grid-template-columns:repeat(2,minmax(0,1fr)); max-width:440px}
.opts.nums .opt{font-family:var(--f-display); font-size:clamp(2.4rem,6vw,3.2rem); min-height:96px}
.en-q{color:var(--c); font-size:1.12em}

/* ---- Arte y música ---- */
.mix{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:10px 14px}
.mix b{font-family:var(--f-display); font-size:2.6rem; color:var(--ink-soft)}
.blob{--b:#ccc; display:grid; place-items:center; width:clamp(82px,13vw,112px); aspect-ratio:1/1; border-radius:52% 48% 50% 50% / 48% 54% 46% 52%;
  background:radial-gradient(circle at 34% 28%,color-mix(in srgb,var(--b) 45%,#fff) 0 14%,var(--b) 48%,color-mix(in srgb,var(--b) 78%,#000) 100%);
  box-shadow:inset 0 -7px 0 rgba(0,0,0,.12),0 8px 14px var(--shadow); font-family:var(--f-display); font-weight:800; font-size:2.6rem; color:var(--ink-soft)}
.mix.three{gap:8px 10px}
.mix.three .blob{width:clamp(64px,8.5vw,92px)}
.mix.three b{font-size:2.1rem}
.blob.white{box-shadow:inset 0 -7px 0 rgba(0,0,0,.08),0 0 0 3px var(--line),0 8px 14px var(--shadow)}
.blob.q{background:var(--paper); border:4px dashed color-mix(in srgb,var(--c) 55%,var(--line)); box-shadow:none}
.blob.filled{animation:bounce .6s}
.blob.mini{width:44px; font-size:1rem; box-shadow:inset 0 -4px 0 rgba(0,0,0,.12),0 3px 6px var(--shadow)}
.blob.mini.white{box-shadow:inset 0 -4px 0 rgba(0,0,0,.08),0 0 0 2px var(--line)}
.opts.colors{grid-template-columns:repeat(2,minmax(0,1fr)); max-width:520px}
.opts.colors .opt{display:flex; align-items:center; gap:14px; font-size:clamp(1.25rem,2.6vw,1.6rem); text-align:left}
.opts.pairs{grid-template-columns:1fr}
.pair{display:inline-flex; align-items:center; gap:4px; font-family:var(--f-display); font-weight:800; color:var(--ink-soft)}
.shape{width:clamp(170px,26vw,240px); height:auto; filter:drop-shadow(0 10px 10px var(--shadow)); animation:popin .45s cubic-bezier(.3,1.6,.5,1) both}
.opts.fams{grid-template-columns:1fr; max-width:520px}
.opts.fams .opt{display:flex; flex-direction:column; align-items:flex-start; gap:2px; text-align:left; padding:12px 20px}
.opts.fams strong{font-family:var(--f-display); font-size:1.6rem; line-height:1.1}
.opts.fams small{font-family:var(--f-read); font-weight:400; font-size:1.05rem; color:var(--ink-soft)}
.ins-img{width:64px; height:64px; object-fit:contain}
.ins-img.big{width:clamp(150px,22vw,210px); height:auto; filter:drop-shadow(0 10px 8px var(--shadow)); animation:popin .45s cubic-bezier(.3,1.6,.5,1) both}
.ins-img.big.reveal{width:clamp(110px,15vw,150px)}
.opts.insts{grid-template-columns:repeat(2,minmax(0,1fr)); max-width:520px}
.opts.insts .opt{display:flex; flex-direction:column; align-items:center; gap:4px; font-size:clamp(1.1rem,2.3vw,1.35rem); padding:12px 8px}
.opts.insts .ins-img{width:clamp(70px,10vw,96px); height:clamp(70px,10vw,96px)}
.opts.insts .nm{overflow-wrap:normal; word-break:normal; hyphens:none; line-height:1.1}
.opts.insts.many .opt{padding:12px 4px}
.opts.insts.many .nm.long{font-size:.84em}
.opts.insts.many .nm.xlong{font-size:.74em}
.opts.insts .nm.xlong{font-size:.88em}
.snd-row{display:flex; gap:18px}
.snd-n{width:64px; height:64px; border-radius:50%; display:grid; place-items:center; font-family:var(--f-display); font-weight:800; font-size:2rem; background:var(--paper); color:var(--ink-soft); box-shadow:inset 0 -5px 0 var(--line); transition:transform .15s}
.snd-n.on{background:var(--c); color:#fff; transform:scale(1.15); box-shadow:inset 0 -5px 0 color-mix(in srgb,var(--c) 65%,#000)}
.simon{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; width:100%; max-width:720px}
.skey{--k:#e33; aspect-ratio:3/4; border:0; border-radius:26px; display:flex; align-items:flex-end; justify-content:center; padding-bottom:16px; color:#fff; font-family:var(--f-display); font-weight:800; font-size:clamp(1.5rem,3.4vw,2.1rem);
  text-shadow:0 2px 0 rgba(0,0,0,.2); background:linear-gradient(180deg,color-mix(in srgb,var(--k) 70%,#fff),var(--k)); box-shadow:inset 0 -10px 0 color-mix(in srgb,var(--k) 68%,#000),0 10px 18px color-mix(in srgb,var(--k) 35%,transparent);
  transition:transform .08s,filter .08s; touch-action:manipulation}
.skey.on{transform:translateY(5px) scale(.97); filter:brightness(1.25) saturate(1.1); box-shadow:inset 0 -4px 0 color-mix(in srgb,var(--k) 68%,#000),0 0 0 6px color-mix(in srgb,var(--k) 40%,transparent),0 0 34px var(--k)}
.tag.go{background:var(--ok); color:#fff; animation:bounce .5s}
.tag.good{background:var(--ok-bg); color:var(--ok)}
@media (max-width:600px){ .simon{gap:8px} .skey{border-radius:18px} }
/* ---- puzzles ---- */
.sr{position:absolute!important; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0}
.pz-wrap{display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:22px 28px; align-items:center; width:100%}
.pz-wrap.build{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); align-items:start}
.pz-main{display:flex; flex-direction:column; align-items:center; gap:12px}
.pz-side{display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center}
.pz-board{--ar:1; position:relative; width:min(100%,520px,calc((100vh - 230px) * var(--ar))); min-width:min(100%,240px); margin:0 auto; padding:clamp(9px,1.6vw,14px); border-radius:22px;
  background:linear-gradient(160deg,#E2B27A,#C68B4C); box-shadow:inset 0 -6px 0 rgba(0,0,0,.2),inset 0 4px 0 rgba(255,255,255,.4),0 14px 26px var(--shadow)}
.pz-grid{position:relative; width:100%; border-radius:10px; background:#7A4F28; box-shadow:inset 0 4px 10px rgba(0,0,0,.35); overflow:hidden}
.pz-tile{position:absolute; left:0; top:0; border:0; padding:0; margin:0; background:none; border-radius:0; transition:transform .14s ease-out; touch-action:none; -webkit-tap-highlight-color:transparent; cursor:pointer}
.pz-face{position:absolute; inset:0; display:block; background-repeat:no-repeat; border-radius:7px; pointer-events:none;
  box-shadow:inset 0 0 0 2px rgba(92,52,20,.6),inset 0 3px 0 rgba(255,255,255,.35),inset 0 -4px 0 rgba(0,0,0,.2)}
.pz-num{position:absolute; left:7px; top:3px; display:none; font:800 clamp(.95rem,2vw,1.2rem)/1.3 var(--f-display); color:#fff; text-shadow:0 1px 3px #000,0 0 2px #000; pointer-events:none}
.pz-board.nums .pz-num{display:block}
.pz-board.marks .pz-tile.home::after{content:"✓"; position:absolute; right:5px; bottom:4px; width:22px; height:22px; display:grid; place-items:center; border-radius:50%;
  background:#2DAA4F; color:#fff; font:800 .85rem/1 var(--f-display); box-shadow:0 1px 3px rgba(0,0,0,.4); pointer-events:none}
.pz-board.solved .pz-tile.home::after{display:none}
.pz-tile.hint{z-index:2}
.pz-tile.hint .pz-face,.pz-cell.hint{animation:pzhint .8s ease-in-out infinite; box-shadow:inset 0 0 0 4px #FFD23F,0 0 18px 4px rgba(255,210,63,.9)}
@keyframes pzhint{50%{filter:brightness(1.25)}}
.pz-tile.nope .pz-face{animation:shake .35s}
.pz-board.solved .pz-face{box-shadow:none; border-radius:0; transition:box-shadow .5s,border-radius .5s}
.pz-board.solved{animation:pulse .6s}
.pz-tile.last{animation:fadein .6s}
.pz-ref{position:relative; width:min(100%,190px); max-height:240px; border-radius:16px; background-size:cover; background-position:center; box-shadow:0 0 0 5px var(--card),0 10px 20px var(--shadow)}
.pz-refnums{position:absolute; inset:0; display:none; place-items:center; font:800 1.15rem var(--f-display); color:#fff; text-shadow:0 1px 3px #000,0 0 2px #000;
  background-image:linear-gradient(to right,rgba(255,255,255,.6) 1.5px,transparent 1.5px),linear-gradient(to bottom,rgba(255,255,255,.6) 1.5px,transparent 1.5px)}
.pz-ref.nums .pz-refnums{display:grid}
.pz-moves{font:800 1.25rem var(--f-display)}
.pz-moves strong{font-variant-numeric:tabular-nums}
.pz-goal{display:flex; align-items:center; gap:8px; color:var(--ink-soft); font-weight:700}
.pz-goal .stars{font-size:1.2rem}
.pz-board.build .pz-cells{position:relative; display:grid; width:100%; aspect-ratio:1; border-radius:10px; background:#7A4F28; box-shadow:inset 0 4px 10px rgba(0,0,0,.35); overflow:hidden}
.pz-board.ghost .pz-cells::before{content:""; position:absolute; inset:0; background:var(--pz) center/cover; opacity:.28; filter:saturate(.6)}
.pz-cell{position:relative; border:0; padding:0; margin:0; background:transparent; border-radius:0; box-shadow:inset 0 0 0 1px rgba(255,255,255,.28); -webkit-tap-highlight-color:transparent}
.pz-board.picking .pz-cell:not(.filled){box-shadow:inset 0 0 0 2px rgba(255,236,150,.8)}
.pz-cell.over{background:rgba(255,236,150,.45)}
.pz-cell.filled .pz-face{animation:popin .3s}
.pz-cell.nope{animation:shake .35s; background:rgba(255,80,80,.35)}
.pz-board.solved .pz-cell{box-shadow:none}
.pz-tray{display:grid; grid-template-columns:repeat(var(--cols),minmax(0,1fr)); gap:clamp(8px,1.4vw,14px); align-content:start; width:100%; max-width:460px; margin:0 auto}
.pz-piece{position:relative; aspect-ratio:1; border:0; padding:0; margin:0; border-radius:8px; background:transparent; touch-action:none; -webkit-tap-highlight-color:transparent; cursor:grab;
  box-shadow:0 5px 10px var(--shadow); transition:opacity .2s,transform .2s}
.pz-piece .pz-face{transition:transform .2s}
.pz-piece.sel{outline:4px solid var(--sun); outline-offset:3px; transform:scale(1.05)}
.pz-piece.lifted{opacity:.25}
.pz-piece.gone{opacity:0; transform:scale(.6); pointer-events:none; box-shadow:none}
.pz-board,.pz-tile,.pz-piece,.pz-cell,.pz-tray,.pz-drag{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
.pz-drag{position:fixed; left:0; top:0; z-index:60; pointer-events:none; filter:drop-shadow(0 12px 14px rgba(0,0,0,.35))}
.pz-pic{position:relative; width:min(100%,440px); aspect-ratio:1; margin:0 auto; border-radius:16px; background-size:cover; overflow:hidden; box-shadow:0 0 0 6px var(--card),0 12px 24px var(--shadow)}
.pz-pic::after{content:""; position:absolute; inset:0; pointer-events:none; background-size:calc(100% / var(--g)) calc(100% / var(--g));
  background-image:linear-gradient(to right,rgba(255,255,255,.55) 1.5px,transparent 1.5px),linear-gradient(to bottom,rgba(255,255,255,.55) 1.5px,transparent 1.5px)}
.pz-hole{position:absolute; z-index:1; display:grid; place-items:center; background:var(--paper); box-shadow:inset 0 0 0 3px var(--c),inset 0 6px 14px rgba(0,0,0,.25);
  font:800 clamp(1.6rem,4vw,2.4rem) var(--f-display); color:var(--c)}
.pz-hole .pz-face{border-radius:0; box-shadow:none}
.pz-hole.filled{background:none; box-shadow:none; animation:popin .4s}
.opts.pz-opts{grid-template-columns:repeat(3,minmax(0,1fr)); max-width:470px}
.opts.pz-opts.four{grid-template-columns:repeat(2,minmax(0,1fr)); max-width:380px}
.pz-opts .opt{display:grid; place-items:center; padding:10px; min-height:0}
.pz-optface{position:relative; display:block; width:100%; max-width:130px; aspect-ratio:1; border-radius:8px; overflow:hidden; box-shadow:0 3px 8px var(--shadow)}
.pz-optface .pz-face{border-radius:0}
.opts.bodies{grid-template-columns:repeat(2,minmax(0,1fr)); max-width:440px}
.opts.bodies .opt{display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px}
.opts.bodies .shape{width:clamp(64px,10vw,96px); height:auto}
/* en vertical (iPad de pie y móviles), el tablero arriba y la bandeja debajo, en pocas filas para que todo quepa sin bajar */
@media (max-aspect-ratio:1/1) and (min-width:600px){
  .pz-wrap.build{grid-template-columns:minmax(0,1fr); gap:18px}
  .pz-wrap.build .pz-board{width:min(100%,560px,calc(100vh - 500px))}
  .pz-tray{max-width:720px; --cols:8!important}
  .pz-tray.g3{--cols:5!important}
}
@media (max-width:599px){
  .pz-wrap.build .pz-board{width:min(100%,calc(100vh - 430px))}
  .pz-tray.g3{--cols:5!important}
  .pz-tray.g4{--cols:6!important}
  .pz-tray{gap:7px}
}
@media (max-width:760px){
  .pz-wrap,.pz-wrap.build{grid-template-columns:minmax(0,1fr)}
  .pz-board{width:min(100%,calc((100vh - 300px) * var(--ar)))}
  .pz-side{flex-direction:row; flex-wrap:wrap; justify-content:center}
  .pz-side .with-say{width:100%; justify-content:center}
  .pz-ref{width:110px}
}
/* ---------- estilos propios de la app (app.css) ---------- */
/* Mochi Dinosaurios: color de cada sección (con los de la paleta del motor) */
:root{--conoce:var(--verde); --como:var(--naranja); --cuando:var(--morado); --paleo:var(--turquesa); --cuentos:var(--rosa)}
/* fondo de selva suave (en modo oscuro manda el del motor) */
:root{--sky1:#CDEFC4; --sky2:#F3FBEF}
.vh{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.dino{display:block; max-width:100%; height:auto; -webkit-user-drag:none; user-select:none}
.dino.big{width:clamp(170px,30vw,260px); filter:drop-shadow(0 8px 6px var(--shadow)); animation:popin .45s cubic-bezier(.3,1.6,.5,1) both}
/* opciones con dibujo */
.opts.dinos{grid-template-columns:repeat(3,minmax(0,1fr)); max-width:720px}
.opts.dinos.four{grid-template-columns:repeat(4,minmax(0,1fr)); max-width:860px}
.opts.dinos.two{grid-template-columns:repeat(2,minmax(0,1fr)); max-width:560px}
.opts.dinos .opt{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:8px; min-height:140px}
.opts.dinos .opt .dino{width:100%; max-width:180px; aspect-ratio:1/1; object-fit:contain; pointer-events:none}
.opts.dinos .opt-name{font-size:clamp(1rem,2.2vw,1.25rem); line-height:1.15; text-align:center}
@media (max-width:640px){ .opts.dinos.four{grid-template-columns:repeat(2,minmax(0,1fr))} }
/* sombras */
.dino.sil{filter:brightness(0) opacity(.82); transition:filter .6s}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .dino.sil{filter:brightness(0) invert(1) opacity(.85)} }
:root[data-theme="dark"] .dino.sil{filter:brightness(0) invert(1) opacity(.85)}
.silbox .dino.big{animation:none}
.silbox.part.l .dino{clip-path:inset(0 42% 0 0)}
.silbox.part.r .dino{clip-path:inset(0 0 0 42%)}
.silbox.show .dino.sil{filter:drop-shadow(0 8px 6px var(--shadow)); clip-path:inset(0 0 0 0); transition:filter .6s,clip-path .6s}
/* memory con dibujos y nombres */
.dmemo .face img{width:86%; height:86%; object-fit:contain}
.dmemo .face.nm{font-size:clamp(.8rem,1.9vw,1.1rem); padding:4px; line-height:1.1; text-align:center; -webkit-hyphens:auto; hyphens:auto; overflow-wrap:break-word}
/* ordenar por tamaño */
.dtiles .tile{display:flex; flex-direction:column; align-items:center; gap:2px; width:130px; min-height:130px; padding:6px; background:var(--card); color:var(--ink);
  border:3px solid color-mix(in srgb,var(--c) 35%,var(--line)); text-shadow:none; font-size:.95rem; box-shadow:inset 0 -5px 0 var(--line)}
.dtiles .tile .dino{width:96px; height:96px; object-fit:contain; pointer-events:none}
.dtiles .tile-name{font-size:.9rem; line-height:1.1}
.dslots .slot{width:110px; height:110px; padding:4px; font-size:1rem}
.dslots .slot .dino{width:100%; height:100%; object-fit:contain}
@media (max-width:600px){ .dtiles .tile{width:46%; min-height:120px} .dslots .slot{width:76px; height:76px} }
/* barras de tamaño */
.size-area{width:100%; max-width:620px}
.bars{display:grid; gap:10px; width:100%; margin-top:6px}
.bar-row{display:grid; grid-template-columns:56px 1fr auto; align-items:center; gap:10px}
.bar-img{width:56px; height:56px; object-fit:contain}
.bar-emo{font-size:2.2rem; text-align:center}
.bar{height:22px; border-radius:11px; background:var(--paper); box-shadow:inset 0 2px 0 var(--line); overflow:hidden}
.bar i{display:block; height:100%; border-radius:11px; background:var(--c); animation:grow .8s ease-out both}
@keyframes grow{from{width:0}}
/* dinopedia */
.album-h{width:100%; margin:14px 0 4px; font-family:var(--f-display); font-size:1.3rem}
.album .ani-img{width:72px; height:72px; object-fit:contain}
.cromo span{font-size:.85rem; overflow-wrap:anywhere}
.ficha .dino.big{width:200px; animation:none}
.ficha h2{color:var(--verde)}
/* ================= portada propia (c-portada.html) ================= */
.dhome{display:grid; gap:26px; margin-top:4px}
/* el valle: paisaje con Mochi y dinosaurios que se pueden tocar */
.valle{position:relative; aspect-ratio:16/7.2; border-radius:34px; overflow:hidden; isolation:isolate;
  box-shadow:0 8px 0 color-mix(in srgb,#3F8A2E 55%,var(--line)),0 16px 34px var(--shadow)}
.valle-fondo{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 62%; z-index:-1}
.valle-wrap{position:relative}
.vdino,.vmochi{position:absolute; left:calc(var(--x)*1%); height:calc(var(--hh)*var(--k,1)*1%); transform:translateX(-50%); padding:0; border:0; background:none;
  filter:drop-shadow(0 10px 6px rgba(30,60,20,.28)); -webkit-tap-highlight-color:transparent; cursor:pointer; transform-origin:50% 100%}
.vdino,.vmochi{width:max-content}   /* si no, los que están cerca del borde derecho se estrechan */
.vdino img,.vmochi img{display:block; height:100%; width:auto; max-width:none; pointer-events:none; user-select:none; -webkit-user-drag:none}
.vdino{animation:respira 3.6s ease-in-out infinite}
.vdino:nth-of-type(2n){animation-delay:-1.4s} .vdino:nth-of-type(3n){animation-delay:-2.3s}
.vdino.vuela{filter:drop-shadow(0 18px 10px rgba(30,60,20,.18)); animation:vuela 7s ease-in-out infinite}
.vmochi{--x:10; --hh:60; bottom:3%}
.vmochi .mochi{width:auto}
.vdino.salta,.vmochi.salta{animation:salta .7s cubic-bezier(.3,1.5,.5,1)}
@keyframes respira{50%{transform:translateX(-50%) scale(1.012,1.03)}}
@keyframes vuela{0%,100%{transform:translate(-50%,0) rotate(-3deg)} 50%{transform:translate(-36%,-7%) rotate(4deg)}}
/* el Pteranodon entra volando desde la derecha cada vez que se abre la portada (va en la imagen, así al tocarlo no vuelve a entrar) */
.vdino.vuela img{animation:llega 2.4s cubic-bezier(.22,.8,.32,1) .3s both}
@keyframes llega{0%{transform:translate(150%,-60%) rotate(-14deg) scale(.75)} 100%{transform:none}}
@keyframes salta{0%{transform:translateX(-50%)} 30%{transform:translate(-50%,-16%) scale(1.06)} 60%{transform:translate(-50%,0) scale(1.08,.92)} 100%{transform:translateX(-50%)}}
.valle-bubble{position:absolute; left:20%; top:5%; max-width:min(44%,470px); display:flex; align-items:center; gap:8px 14px; padding:12px 18px}
.valle-bubble::before{top:auto; bottom:20px}
.valle-bubble h1{font-size:clamp(1.6rem,3.4vw,2.4rem)}
.valle-bubble p{font-size:clamp(.95rem,1.7vw,1.1rem)}
.valle-bubble .valle-pista{margin-top:2px; font-size:.92rem; font-weight:700; color:color-mix(in srgb,var(--verde) 80%,var(--ink))}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .valle-fondo{filter:brightness(.82) saturate(.95)} }
:root[data-theme="dark"] .valle-fondo{filter:brightness(.82) saturate(.95)}
/* en pantallas estrechas el valle es más alto, los dibujos algo más pequeños y el bocadillo va debajo */
@media (max-width:760px){
  .valle{aspect-ratio:5/4; border-radius:28px}
  .valle-fondo{object-position:40% 70%}
  .vdino,.vmochi{--k:.74}
  .vmochi{--x:14; --hh:62}
  .vdino.vuela{--x:76!important}   /* el Pteranodon, más a la izquierda para que no se le corte el ala */
  .valle-bubble{position:relative; left:auto; top:auto; max-width:none; margin-top:16px; flex-wrap:nowrap}
  .valle-bubble::before{left:40px; top:-14px; bottom:auto; border:14px solid transparent; border-bottom-color:var(--card); border-top:0}
}
/* las secciones, con todos sus juegos a la vista */
.dsecs.subjects{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr)); gap:24px; padding-top:18px}
.dsec{--c:var(--verde); position:relative; display:flex; flex-direction:column; border-radius:30px; background:var(--card);
  box-shadow:0 6px 0 color-mix(in srgb,var(--c) 45%,var(--line)),0 14px 28px var(--shadow)}
.dsec-head{position:relative; display:grid; grid-template-columns:1fr; gap:4px; text-align:left; border:0; border-radius:30px 30px 0 0; padding:18px 150px 16px 22px; min-height:150px;
  color:var(--on-c); background:linear-gradient(160deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c));
  background-image:radial-gradient(circle at 18% 120%,rgba(255,255,255,.18) 0 40px,transparent 41px),radial-gradient(circle at 70% -30%,rgba(255,255,255,.16) 0 60px,transparent 61px),linear-gradient(160deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c))}
.dsec-img{position:absolute; right:6px; top:-26px; width:150px; height:150px; object-fit:contain; filter:drop-shadow(0 8px 6px rgba(0,0,0,.2)); transition:transform .25s}
.dsec-head:hover .dsec-img{transform:rotate(-6deg) scale(1.05)}
.dsec-name{font-family:var(--f-display); font-weight:800; font-size:clamp(1.7rem,3.2vw,2.1rem); line-height:1; text-shadow:0 3px 0 rgba(0,0,0,.14)}
.dsec-count{justify-self:start; margin-block:2px 6px; padding:3px 12px; border-radius:999px; background:rgba(255,255,255,.24); font-family:var(--f-display); font-weight:800; font-size:1rem}
.dsec .subj-cup{left:auto; right:120px; top:-18px}
.dsec-games{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; padding:16px}
.gchip{display:grid; grid-template-columns:auto 1fr; grid-template-rows:auto auto; align-items:center; gap:0 10px; text-align:left; min-height:64px; padding:8px 12px; border:0; border-radius:18px;
  background:color-mix(in srgb,var(--c) 10%,var(--card)); color:var(--ink); box-shadow:inset 0 -4px 0 color-mix(in srgb,var(--c) 28%,var(--line)); transition:transform .15s}
.gchip:active{transform:translateY(2px) scale(.98)}
.gchip-ic{grid-row:1/3; font-size:1.8rem; line-height:1}
.gchip-t{font-family:var(--f-display); font-weight:800; font-size:1.02rem; line-height:1.1}
.gchip-st{font-size:.85rem; font-weight:700; color:var(--ink-soft); font-variant-numeric:tabular-nums}
@media (max-width:480px){ .dsec-head{padding-right:118px; min-height:130px} .dsec-img{width:120px; height:120px; top:-18px} .dsec .subj-cup{right:96px} }
/* lo que llega pronto: huevos que tiemblan al tocarlos */
.pronto{text-align:center; padding:20px 16px 22px; border-radius:30px; background:linear-gradient(180deg,color-mix(in srgb,#F6E7C1 70%,var(--card)),color-mix(in srgb,#EAD3A0 60%,var(--card)));
  box-shadow:inset 0 -10px 0 color-mix(in srgb,#C9A56A 45%,var(--card)),0 10px 22px var(--shadow)}
.pronto-h{font-size:clamp(1.6rem,3vw,2rem)}
.pronto-p{margin:4px auto 10px; max-width:52ch; color:var(--ink-soft)}
.eggs{display:flex; justify-content:center; gap:clamp(10px,3vw,36px); flex-wrap:wrap}
.egg{display:flex; flex-direction:column; align-items:center; gap:2px; width:clamp(104px,22vw,170px); padding:4px; border:0; background:none; color:var(--ink); transform-origin:50% 90%}
.egg img{width:72%; height:auto; filter:drop-shadow(0 8px 6px rgba(80,50,10,.25)); pointer-events:none}
.egg-name{font-family:var(--f-display); font-weight:800; font-size:1.05rem; line-height:1.1}
.egg-tag{font-size:.8rem; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:#9A6A1E}
.egg.tiembla{animation:tiembla .8s ease-in-out}
@keyframes tiembla{15%{transform:rotate(-9deg)} 30%{transform:rotate(8deg)} 45%{transform:rotate(-6deg)} 60%{transform:rotate(4deg)} 75%{transform:rotate(-2deg)}}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .egg-tag{color:#F2C46B} }
:root[data-theme="dark"] .egg-tag{color:#F2C46B}

/* ================= Paleontólogos (d-paleo.html) ================= */
/* ¡A excavar!: el fósil debajo de una capa de arena que se quita con el dedo */
.dig-wrap{display:flex; flex-direction:column; align-items:center; gap:12px; width:100%}
.dig{position:relative; width:min(100%,420px,calc(100vh - 270px)); min-width:min(100%,230px); aspect-ratio:1; border-radius:26px; overflow:hidden;
  background:radial-gradient(circle at 50% 45%,#F5E2BA,#DDB984); box-shadow:0 8px 0 color-mix(in srgb,#8A5A2B 50%,var(--line)),0 14px 28px var(--shadow)}
.dig-img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; -webkit-user-drag:none; user-select:none; pointer-events:none}
.dig-img.obj{inset:13%; width:74%; height:74%; object-fit:contain; filter:drop-shadow(0 6px 5px rgba(80,50,20,.3))}
.dig-sand{position:absolute; inset:0; width:100%; height:100%; touch-action:none; cursor:grab; transition:opacity .7s}
.dig-sand.gone{opacity:0; pointer-events:none}
.dig.found{animation:pulse .6s}
.dig-ask{width:100%}
.dig-opts{width:100%; display:flex; justify-content:center}
.dig-opts.wait{visibility:hidden}
/* Monta el esqueleto */
.esq-board .pz-cells{background:#C79E68}
.esq-done{display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center; scroll-margin-bottom:24px; animation:popin .5s cubic-bezier(.3,1.6,.5,1)}
/* Sigue las huellas */
.huella-big{width:clamp(150px,26vw,220px)}
.barro{position:relative; width:min(100%,640px); aspect-ratio:16/9; border-radius:24px; overflow:hidden; margin:0 auto;
  background:radial-gradient(ellipse at 25% 30%,#EBD3A6,transparent 60%),radial-gradient(ellipse at 78% 72%,#D2AE77,transparent 55%),#E0C08D;
  box-shadow:inset 0 4px 14px rgba(90,60,20,.25),0 8px 0 color-mix(in srgb,#9A6E3A 50%,var(--line))}
.pisada{position:absolute; aspect-ratio:1; color:#6A4220; opacity:.82; filter:drop-shadow(0 1px 0 rgba(255,245,220,.6)); animation:pisa .35s ease-out both; pointer-events:none}
.pisada svg{display:block; width:100%; height:100%}
@keyframes pisa{from{opacity:0; scale:1.6}}
/* ¿Qué hace un paleontólogo? */
.oficio-mochi{width:clamp(110px,18vw,160px); height:auto; filter:drop-shadow(0 6px 5px var(--shadow)); animation:popin .45s cubic-bezier(.3,1.6,.5,1) both}
.pasos-hechos{list-style:none; counter-reset:paso; display:flex; flex-direction:column; gap:8px; width:min(100%,560px); margin:0 auto; padding:0}
.pasos-hechos li{counter-increment:paso; display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:16px; background:color-mix(in srgb,var(--c) 16%,var(--card)); font-weight:700; text-align:left; animation:popin .3s}
.pasos-hechos li::before{content:counter(paso); display:grid; place-items:center; width:30px; height:30px; flex:none; border-radius:50%; background:var(--c); color:var(--on-c); font-weight:800}
.pasos{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr)); gap:10px; width:min(100%,760px); margin:0 auto}
.paso{display:flex; align-items:center; gap:10px; padding:12px 16px; border:0; border-radius:18px; background:var(--card); color:var(--ink); font:inherit; font-weight:700; text-align:left;
  box-shadow:0 4px 0 var(--line),0 8px 16px var(--shadow); cursor:pointer; -webkit-tap-highlight-color:transparent}
.paso.used{opacity:.3; box-shadow:none}
.paso.shake{animation:shake .35s}
.paso-e{font-size:1.6rem; line-height:1; flex:none}

/* ================= huevos que se abren (c-portada.html) ================= */
.egg .egg-pic{position:relative; display:block; width:72%; aspect-ratio:1}
.egg .egg-pic img{position:absolute; inset:0; width:100%; height:100%; object-fit:contain}
.egg-cracks{position:absolute; inset:8% 18% 4%; pointer-events:none}
.egg-cracks svg{width:100%; height:100%; overflow:visible}
.egg-cracks path{fill:none; stroke:#5A3714; stroke-width:3.2; stroke-linecap:round; stroke-linejoin:round; opacity:0; transition:opacity .4s}
.egg.ck-1 .ck1,.egg.ck-2 .ck1,.egg.ck-2 .ck2,.egg.ck-3 path{opacity:.85}
.egg.lista{animation:quiere 1.6s ease-in-out infinite}
.egg.lista .egg-pic::before{content:""; position:absolute; inset:-8%; border-radius:50%; background:radial-gradient(circle,rgba(255,226,120,.75),transparent 65%); animation:brilla 1.6s ease-in-out infinite}
.egg.lista .egg-tag{color:var(--paleo)}
@keyframes quiere{0%,55%,100%{transform:rotate(0)} 62%{transform:rotate(-8deg)} 70%{transform:rotate(7deg)} 78%{transform:rotate(-5deg)} 86%{transform:rotate(3deg)}}
@keyframes brilla{50%{opacity:.35; transform:scale(.9)}}
.egg.abriendo{animation:none; pointer-events:none}
.egg.abriendo .egg-pic::before{display:none}
.egg .egg-top{clip-path:polygon(0 0,100% 0,100% 52%,89% 46%,78% 55%,66% 46%,54% 55%,42% 46%,30% 55%,18% 46%,0 52%); animation:cascara 1s .35s cubic-bezier(.3,.6,.4,1) both}
.egg .egg-bot{clip-path:polygon(0 52%,18% 46%,30% 55%,42% 46%,54% 55%,66% 46%,78% 55%,89% 46%,100% 52%,100% 100%,0 100%)}
.egg .egg-sale{inset:-20% -25% 10%; width:150%; height:auto; z-index:1; animation:sale .9s .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes cascara{to{transform:translate(-30%,-95%) rotate(-38deg); opacity:0}}
@keyframes sale{from{transform:translateY(45%) scale(.2); opacity:0} to{transform:translateY(-12%) scale(1)}}
.dsec.nueva{animation:popin .6s cubic-bezier(.3,1.6,.5,1) both; box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 55%,transparent),0 14px 28px var(--shadow)}
.egg-switch{display:grid; gap:6px; margin:10px 0 14px; padding:12px 14px; border-radius:16px; background:color-mix(in srgb,var(--paleo) 10%,var(--card))}
.egg-switch p{margin:0}
.egg-switch .btn{justify-self:start}

/* ================= Paleontólogos, más difícil (nivel 2 y 3) ================= */
/* pistas sueltas bajo la arena */
.dig-site{position:absolute; inset:0}
.dig-site img{position:absolute; height:auto; transform:translate(-50%,-50%) rotate(var(--r,0deg)); filter:drop-shadow(0 5px 4px rgba(80,50,20,.3)); -webkit-user-drag:none; user-select:none; pointer-events:none}
/* corte del terreno: tres capas, la de abajo es la más antigua */
.capas{position:absolute; inset:0; display:grid; grid-template-rows:repeat(3,1fr)}
.capa{position:relative; overflow:hidden; box-shadow:inset 0 3px 0 rgba(90,60,30,.22)}
.capa:nth-child(1){background:linear-gradient(#F0D9A9,#E2C38B); box-shadow:none}
.capa:nth-child(2){background:linear-gradient(#D3A972,#C49862)}
.capa:nth-child(3){background:linear-gradient(#AA8058,#956B46)}
.capa img{position:absolute; top:50%; height:80%; width:auto; transform:translate(-50%,-50%) rotate(var(--r,0deg)); filter:drop-shadow(0 4px 3px rgba(60,35,10,.35)); pointer-events:none; -webkit-user-drag:none}
.forden{display:flex; flex-direction:column; gap:10px; width:100%}
.forden .paso-e img,.pasos-hechos .paso-e img{width:44px; height:44px; object-fit:contain; display:block}
/* la cadera: huella con su medida */
.truco{max-width:600px; margin:0 auto; padding:10px 16px; border-radius:16px; background:color-mix(in srgb,var(--sun) 28%,var(--card)); font-weight:700; text-align:center}
.medida{display:flex; flex-direction:column; align-items:center; gap:4px}
.medida .huella-big{width:clamp(130px,22vw,190px); filter:drop-shadow(0 6px 5px var(--shadow))}
.regla{width:clamp(130px,22vw,190px); height:24px; border:3px solid var(--ink); border-top:0; border-radius:0 0 6px 6px; display:grid; place-items:center; font-weight:800; font-size:1.1rem}
/* la huella de encima tapa un poco la de debajo */
.pisada.encima::before{content:""; position:absolute; inset:-6%; border-radius:50%; background:radial-gradient(circle,#E2C390 50%,transparent 66%); z-index:-1}
/* el museo se ha equivocado */
.int-cell{cursor:pointer; -webkit-tap-highlight-color:transparent}
.int-cell.mala{box-shadow:inset 0 0 0 5px #E8453C; z-index:1; animation:pulse .5s}
.int-side{display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center; width:100%; scroll-margin-bottom:24px}

/* modo oscuro: la sección de los huevos con fondo oscuro y texto claro (antes, texto claro sobre arena) */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .pronto{background:linear-gradient(180deg,color-mix(in srgb,#8A6A34 32%,var(--card)),color-mix(in srgb,#6E5228 30%,var(--card)))} }
:root[data-theme="dark"] .pronto{background:linear-gradient(180deg,color-mix(in srgb,#8A6A34 32%,var(--card)),color-mix(in srgb,#6E5228 30%,var(--card)))}

/* Monta el esqueleto, pantalla alta y estrecha (iPad en vertical, ventana del ordenador): tablero y piezas a la vista a la vez */
@media (max-aspect-ratio:1/1) and (min-width:600px){
  .pz-wrap.build .pz-board.esq-board.g3{width:min(100%,560px,calc(100vh - 580px))}
}
/* … y en una ventana de ordenador baja y ancha: el tablero algo más pequeño para que la pista quepa debajo */
@media (min-aspect-ratio:1/1) and (max-height:760px){
  .pz-wrap.build .pz-board.esq-board{width:min(100%,520px,calc(100vh - 315px))}
}

/* ================= CUÁNDO Y DÓNDE ================= */
.cd-img{object-fit:contain; pointer-events:none}
/* línea del tiempo: tarjetas con dibujo (y pista) */
.pasos.linea{grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.paso.tarjeta{align-items:center}
.paso.tarjeta .paso-e,.linea-hecha .paso-e{width:62px; height:62px; flex:none; display:grid; place-items:center}
.paso.tarjeta .paso-e img,.linea-hecha .paso-e img{width:100%; height:100%; object-fit:contain}
.tarjeta-t{display:flex; flex-direction:column; gap:3px}
.tarjeta-t small{font-weight:600; font-size:.86em; line-height:1.3; opacity:.85}
.linea-hecha li{padding:6px 12px}
.paso.tarjeta.sel{outline:4px solid var(--sun); outline-offset:2px}
.paso.tarjeta.puesta{opacity:.3}
/* la regla del tiempo */
.rtiempo{width:min(100%,860px); margin:0 auto 12px}
.rtiempo-flecha{display:flex; justify-content:space-between; font-weight:800; font-size:.9em; opacity:.75; margin:0 4px 6px}
.rtiempo-slots{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; padding:10px; border-radius:20px;
  background:linear-gradient(90deg,color-mix(in srgb,#C9844A 40%,var(--card)),color-mix(in srgb,var(--c) 30%,var(--card)))}
.rtiempo-slot{display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:6px; min-height:120px; padding:8px 4px; border:2px dashed color-mix(in srgb,var(--ink) 30%,transparent);
  border-radius:16px; background:color-mix(in srgb,var(--card) 70%,transparent); color:var(--ink); font:inherit; cursor:pointer}
.rtiempo-cosas{display:flex; flex-wrap:wrap; justify-content:center; gap:2px}
.rtiempo-cosas img{width:54px; height:54px; object-fit:contain; animation:popin .3s}
.rtiempo-l{font-weight:800; font-size:.8em; line-height:1.2; text-align:center}
.rtiempo-slot.nope,.paisaje-cosa.nope{animation:shake .4s}
.rtiempo-preg{margin-top:12px}
.paso.tarjeta.mini .paso-e{width:50px; height:50px}
/* viaje en el tiempo */
.viaje-escena{display:flex; align-items:center; justify-content:center; gap:12px; width:min(100%,720px); margin:0 auto 6px}
.viaje-mochi{width:110px; height:110px; object-fit:contain; flex:none}
.viaje-bocadillo{flex:1; font-size:1.12em; font-weight:700}
.opts.eras{grid-template-columns:repeat(3,minmax(0,1fr)); max-width:900px}
.opts.eras .opt{position:relative; overflow:hidden; display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px 8px 12px; min-height:170px; isolation:isolate}
.era-bg{position:absolute; inset:0; background-size:cover; background-position:center; opacity:.35; z-index:-1}
.era-n{font-weight:800; font-size:1.1em; padding:2px 10px; border-radius:12px; background:color-mix(in srgb,var(--card) 80%,transparent)}
.era-mini{display:flex; justify-content:center; gap:2px}
.era-mini img{width:46px; height:46px; object-fit:contain}
.era-r{font-weight:700; font-size:.82em; line-height:1.25; padding:4px 6px; border-radius:10px; background:color-mix(in srgb,var(--card) 82%,transparent)}
.opts.eras.solo .opt{min-height:96px; justify-content:center}
.quien-cuando,.mapa-cabeza{display:flex; align-items:center; justify-content:center; gap:14px; width:min(100%,760px); margin:0 auto 6px; text-align:left}
.quien-cuando .dino,.mapa-cabeza .dino{width:150px; height:150px; flex:none; object-fit:contain}
.pista-txt{margin:6px 0 0; font-weight:700; font-size:1.05em; line-height:1.35}
.pareja{display:flex; justify-content:center; gap:16px; flex-wrap:wrap; margin-bottom:6px}
.pareja-uno{display:flex; flex-direction:column; align-items:center; gap:4px; width:min(44%,240px)}
.pareja-uno .cd-img{width:100%; aspect-ratio:1; max-height:200px}
/* ¿quién se ha colado? */
.paisaje{position:relative; width:min(100%,900px); aspect-ratio:3/2; margin:6px auto 0; border-radius:22px; background-size:cover; background-position:center; overflow:hidden; box-shadow:0 6px 18px rgba(0,0,0,.18)}
.paisaje-cosa{position:absolute; transform:translate(-50%,-100%); padding:0; border:0; background:none; cursor:pointer; -webkit-tap-highlight-color:transparent}
.paisaje-cosa img{width:100%; height:auto; display:block; filter:drop-shadow(0 6px 5px rgba(0,0,0,.28)); pointer-events:none}
.paisaje-cosa.bien{animation:pulse .5s}
.paisaje-cosa.bien::after{content:"✓"; position:absolute; right:4%; top:2%; width:34px; height:34px; display:grid; place-items:center; border-radius:50%; background:#E8453C; color:#fff; font-weight:900; font-size:22px}
.colado-porque{margin-top:12px}
/* mapas */
.mapa-caja{width:min(100%,960px); margin:8px auto 0}
.mapa{display:block; width:100%; height:auto}

<script>

const $=(s,r=document)=>r.querySelector(s);
function h(tag,a,...kids){
  const el=document.createElement(tag);
  if(a) for(const k in a){
    const v=a[k]; if(v==null||v===false) continue;
    if(k==='class') el.className=v;
    else if(k.startsWith('on')&&typeof v==='function') el.addEventListener(k.slice(2),v);
    else if(k==='style'&&typeof v==='object') Object.assign(el.style,v);
    else el.setAttribute(k,v===true?'':v);
  }
  for(const c of kids.flat(Infinity)) if(c!=null&&c!==false) el.append(c.nodeType?c:document.createTextNode(String(c)));
  return el;
}
/* iconos de los botones redondos, dibujados (los emojis se descolocan en algunos iPad) */
const svgIcon=(d,cls='')=>{const t=document.createElement('template');t.innerHTML=`<svg class="ico ${cls}" viewBox="0 0 24 24" aria-hidden="true" focusable="false">${d}</svg>`;return t.content.firstChild;};
const ICO={
  sound:()=>svgIcon('<g transform="translate(.8 0)"><path d="M3.5 9.4h3.3L11.6 5.6v12.8l-4.8-3.8H3.5z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M15 9.2a3.9 3.9 0 0 1 0 5.6M17.6 6.6a7.6 7.6 0 0 1 0 10.8" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></g>'),
  mute:()=>svgIcon('<g transform="translate(.6 0)"><path d="M3.5 9.4h3.3L11.6 5.6v12.8l-4.8-3.8H3.5z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M15.4 9.6l4.8 4.8M20.2 9.6l-4.8 4.8" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></g>'),
  back:()=>svgIcon('<path d="M14.6 5.4L8 12l6.6 6.6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'),
  play:()=>svgIcon('<path d="M8.6 5.6v12.8L18.8 12z" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>'),
  star:()=>svgIcon('<path d="M12 3.1l2.7 5.5 6.05.88-4.38 4.27 1.03 6.03L12 16.93 6.6 19.78l1.03-6.03L3.25 9.48l6.05-.88z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>','star'),
};
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));

function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const pickN=(arr,n)=>shuffle(arr).slice(0,n);
function deck(arr){let pool=[];return ()=>{if(!pool.length)pool=shuffle(arr);return pool.pop();};}

function me(){return DB.players.find(p=>p.id===DB.cur)||null;}
const gmax=g=>(g&&g.max)||3;
function starsOf(p,id){return p?Math.min((p.stars&&p.stars[id])||0,gmax(GAMES[id])):0;}
function bestStars(id){return starsOf(me(),id);}
function subjProg(sid,p=me()){const gs=gamesOf(sid).filter(g=>!g.noStars);return {got:gs.reduce((a,g)=>a+starsOf(p,g.id),0),max:gs.reduce((a,g)=>a+gmax(g),0)};}
